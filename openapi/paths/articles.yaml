/articles:
  get:
    tags:
    - articles
    summary: 활성 아티클 목록과 본문
    operationId: listArticles
    description: sort_order 순서의 활성 아티클 전체. 본문은 요청 언어가 없으면 한국어 원고를 반환한다.
      preview_block_count가 null이면 모두에게 전체 공개, 숫자면 비구독 회원에게 그 수만큼의 블록만 보여 준다(구독 판정은 앱).
    parameters:
    - name: X-App-Locale
      in: header
      required: false
      schema:
        type: string
    security:
    - SupabaseBearer: []
    responses:
      '200':
        description: 활성 아티클 목록과 본문
        content:
          application/json:
            schema:
              $ref: ../components/articles.yaml#/schemas/ArticleContentList
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
/article-progress:
  get:
    tags:
    - articles
    summary: 내 아티클 읽음·평가·보상 상태
    operationId: listArticleActivity
    security:
    - SupabaseBearer: []
    responses:
      '200':
        description: 내 아티클 읽음·평가·보상 상태
        content:
          application/json:
            schema:
              $ref: ../components/articles.yaml#/schemas/ArticleActivityList
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
/articles/{article_id}/feedback:
  put:
    tags:
    - articles
    summary: 아티클 평가 저장 및 읽음 처리
    operationId: setArticleFeedback
    security:
    - SupabaseBearer: []
    responses:
      '200':
        description: 아티클 평가 저장 및 읽음 처리
        content:
          application/json:
            schema:
              $ref: ../components/articles.yaml#/schemas/ArticleActivity
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
      '404':
        description: 아티클 없음 또는 계정 삭제 중
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              error:
                value: {error: {code: NOT_FOUND, message: 아티클을 찾을 수 없어요., details: {}}}
      '409':
        description: 아티클 없음 또는 계정 삭제 중
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              error:
                value: {error: {code: NOT_FOUND, message: 아티클을 찾을 수 없어요., details: {}}}
    parameters:
    - name: article_id
      in: path
      required: true
      schema:
        type: string
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/articles.yaml#/schemas/ArticleFeedbackRequest
  delete:
    tags:
    - articles
    summary: 아티클 평가 취소(읽음·보상 기록은 유지)
    operationId: clearArticleFeedback
    security:
    - SupabaseBearer: []
    responses:
      '200':
        description: 아티클 평가 취소(읽음·보상 기록은 유지)
        content:
          application/json:
            schema:
              $ref: ../components/articles.yaml#/schemas/ArticleActivity
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
      '404':
        description: 아티클 없음 또는 계정 삭제 중
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              error:
                value: {error: {code: NOT_FOUND, message: 아티클을 찾을 수 없어요., details: {}}}
    parameters:
    - name: article_id
      in: path
      required: true
      schema:
        type: string
/articles/{article_id}/reward:
  post:
    tags:
    - articles
    summary: 아티클 최초 1회 건초 20개 지급 및 읽음 처리
    operationId: claimArticleReward
    security:
    - SupabaseBearer: []
    responses:
      '200':
        description: 아티클 최초 1회 건초 20개 지급 및 읽음 처리
        content:
          application/json:
            schema:
              $ref: ../components/articles.yaml#/schemas/ArticleActivity
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
      '404':
        description: 아티클 없음 또는 계정 삭제 중
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              error:
                value: {error: {code: NOT_FOUND, message: 아티클을 찾을 수 없어요., details: {}}}
      '409':
        description: 아티클 없음 또는 계정 삭제 중
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              error:
                value: {error: {code: NOT_FOUND, message: 아티클을 찾을 수 없어요., details: {}}}
    parameters:
    - name: article_id
      in: path
      required: true
      schema:
        type: string
    description: 인증 계정과 아티클별 최초 1회 20개. 재요청은 granted=0 및 현재 잔액을 반환하며 중복 지급하지 않는다.
      평가는 선택 사항이다.
