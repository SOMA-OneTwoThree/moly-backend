name: Deploy dev (moly-backend)

# dev 브랜치 push → dev 이미지 빌드(별도 ECR: moly-backend-dev) → dev EC2 1대에 중단배포.
#
# prod 롤링배포(deploy.yml)와 완전 분리 — 상호작용 지점 0:
#   - 별도 IAM 역할 moly-github-actions-dev-role: trust가 dev 브랜치 sub만 허용,
#     SendCommand는 tag:Role=moly-backend-dev 인스턴스만, ELB 권한 없음
#     (dev 워크플로가 prod TG를 조작하는 것이 IAM 레벨에서 불가능)
#   - 별도 ECR 레포(보관 5개) — prod 레포의 롤백 풀(30개)을 잠식하지 않음
#   - 대상 발견 태그가 달라(deploy.yml=moly-backend) 서로의 인스턴스를 볼 수 없음
#
# 중단배포: deregister/drain 없음 — 배포 중 몇십 초 끊김은 dev에서 허용.
# dev 서버가 꺼져 있으면 발견 0대로 명확히 실패 — 서버 켠 뒤 Actions에서 Re-run.
#
# workflow_dispatch: image_tag에 기존 dev-<sha>를 주면 빌드 없이 그 이미지로 재배포(롤백).
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그(dev-<sha> 전체). 비우면 현재 커밋을 빌드해서 배포"
        required: false
        default: ""
      preflight_only:
        description: "Read-only dev deployment preflight; requires an existing image_tag"
        type: boolean
        required: false
        default: false
      crypto_benchmark:
        description: "Synthetic local codec timing only; requires preflight_only"
        type: boolean
        required: false
        default: false
      infra_sha:
        description: "Reviewed chat-encryption infra branch commit (40 hex)"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-moly-backend-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_NAME: moly-backend-dev
  ROLE_ARN: arn:aws:iam::676972757138:role/moly-github-actions-dev-role
  # dev- 접두사: prod sha 태그와 네임스페이스를 시각적으로도 구분
  DEPLOY_TAG: ${{ inputs.image_tag || format('dev-{0}', github.sha) }}
  # Reviewed candidate infra commit; main/prod is not changed by this workflow.
  # Never fall back to the old checkout/main during the encryption rollout.
  DEV_INFRA_SHA: ${{ inputs.infra_sha || '9e86e88ec456bad4e8a9307d5e8f21a478816a4c' }}
  VERIFY_DAILY_REPORT: "true"
  PREFLIGHT_ONLY: ${{ inputs.preflight_only && 'true' || 'false' }}
  CRYPTO_BENCHMARK: ${{ inputs.crypto_benchmark && 'true' || 'false' }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dev deployment target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
          REQUESTED_IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "refs/heads/dev" ]] || [[ ! "$EVENT_NAME" =~ ^(push|workflow_dispatch)$ ]]; then
            echo "DEV_REF_REQUIRED" >&2
            exit 1
          fi
          if [[ "$PREFLIGHT_ONLY" != true && "$PREFLIGHT_ONLY" != false ]]; then
            echo "INVALID_PREFLIGHT_MODE" >&2
            exit 1
          fi
          if [[ "$CRYPTO_BENCHMARK" != true && "$CRYPTO_BENCHMARK" != false ]] || { [[ "$CRYPTO_BENCHMARK" = true ]] && [[ "$PREFLIGHT_ONLY" != true ]]; }; then
            echo "CRYPTO_BENCHMARK_PREFLIGHT_REQUIRED" >&2
            exit 1
          fi
          if [[ "$PREFLIGHT_ONLY" = true ]] && { [[ "$EVENT_NAME" != workflow_dispatch ]] || [[ ! "$REQUESTED_IMAGE_TAG" =~ ^dev-[0-9a-f]{40}$ ]]; }; then
            echo "PREFLIGHT_EXISTING_DEV_IMAGE_REQUIRED" >&2
            exit 1
          fi
          if [[ ! "$DEV_INFRA_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "REVIEWED_DEV_INFRA_SHA_REQUIRED" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_TAG" =~ ^dev-[0-9a-f]{40}$ ]]; then
            echo "INVALID_DEV_IMAGE_TAG" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dispatch로 기존 태그를 지정한 경우 빌드 스킵 — 롤백은 빌드가 아니라 재배포다
      - name: Build and push image
        if: ${{ !inputs.preflight_only && (inputs.image_tag == '' || github.event_name == 'push') }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # scope=dev: 레포 공용 10GB 캐시에서 prod 빌드 캐시를 LRU 축출하지 않도록 분리
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Validate deployed banner catalog and assets
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$IMAGE_NAME:$DEPLOY_TAG"
          if ! docker pull "$image" >/dev/null 2>&1; then
            echo "DEV_IMAGE_PULL_FAILED" >&2
            exit 1
          fi
          if ! docker run --rm --entrypoint sh "$image" -ec '
            if [ -f app/services/banner_catalog.py ]; then
              python scripts/validate_banners.py --assets --environment dev
            fi
          ' >/dev/null 2>&1; then
            echo "DEV_BANNER_VALIDATION_FAILED" >&2
            exit 1
          fi

      - name: Deploy via SSM (single dev instance)
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --region "$AWS_REGION" \
            --repository-name "$IMAGE_NAME" \
            --image-ids imageTag="$DEPLOY_TAG" >/dev/null 2>&1; then
            echo "DEV_IMAGE_NOT_FOUND" >&2
            exit 1
          fi
          if ! IDS="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Role,Values=moly-backend-dev" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)"; then
            echo "DEV_TARGET_LOOKUP_FAILED" >&2
            exit 1
          fi
          if [[ ! "$IDS" =~ ^i-[0-9a-f]+$ ]]; then
            echo "DEV_SINGLE_TARGET_REQUIRED" >&2
            exit 1
          fi
          ID="$IDS"

          # 원격 출력에는 설정/자격 정보가 섞일 수 있어 상태 enum만 노출한다.
          poll_ssm() {
            local cmd_id="$1" status="Pending" query_fails=0 finished=0 i err_file response_code reason
            err_file="$(mktemp)"
            for i in $(seq 1 120); do
              sleep 10
              if status="$(aws ssm get-command-invocation --region "$AWS_REGION" \
                --command-id "$cmd_id" --instance-id "$ID" \
                --query Status --output text 2>"$err_file")"; then
                query_fails=0
                case "$status" in
                  Success|Failed|Cancelled|TimedOut) finished=1; break ;;
                  Pending|InProgress|Delayed|Cancelling) ;;
                  *) rm -f "$err_file"; echo "DEV_SSM_INVALID_STATUS" >&2; return 1 ;;
                esac
                echo "DEV_SSM_PENDING"
              elif [ "$i" -le 3 ] && grep -q InvocationDoesNotExist "$err_file"; then
                echo "DEV_SSM_PENDING"
              else
                query_fails=$((query_fails + 1))
                if [ "$query_fails" -ge 3 ]; then
                  rm -f "$err_file"
                  echo "DEV_SSM_STATUS_UNAVAILABLE" >&2
                  return 1
                fi
              fi
            done
            rm -f "$err_file"
            if [ "$finished" -ne 1 ]; then
              echo "DEV_SSM_TIMEOUT" >&2
              return 1
            fi
            if [ "$status" != Success ]; then
              # 종료코드만 읽고 고정 분류한다. 원격 stdout/stderr는 읽지 않는다.
              response_code="$(aws ssm get-command-invocation --region "$AWS_REGION" \
                --command-id "$cmd_id" --instance-id "$ID" \
                --query ResponseCode --output text 2>/dev/null)" || response_code="unknown"
              case "$response_code" in
                41) reason=PRE_HOST_MARKER ;;
                50) reason=PRE_API_EXEC ;;
                51) reason=PRE_API_SETTINGS ;;
                52) reason=PRE_API_ENV ;;
                55) reason=PRE_API_FINGERPRINT ;;
                60) reason=PRE_CONSUMER_EXEC ;;
                61) reason=PRE_CONSUMER_SETTINGS ;;
                62) reason=PRE_CONSUMER_ENV ;;
                65) reason=PRE_CONSUMER_FINGERPRINT ;;
                71) reason=POST_HOST_MARKER ;;
                74) reason=POST_WORKER_HOST_CHANGED ;;
                80) reason=POST_API_EXEC ;;
                81) reason=POST_API_SETTINGS ;;
                82) reason=POST_API_ENV ;;
                83) reason=POST_API_CONFIG_CHANGED ;;
                84) reason=POST_API_SHA ;;
                85) reason=POST_API_FINGERPRINT ;;
                90) reason=POST_CONSUMER_EXEC ;;
                91) reason=POST_CONSUMER_SETTINGS ;;
                92) reason=POST_CONSUMER_ENV ;;
                93) reason=POST_CONSUMER_CONFIG_CHANGED ;;
                94) reason=POST_CONSUMER_SHA ;;
                95) reason=POST_CONSUMER_FINGERPRINT ;;
                101) reason=INFRA_DIRECTORY ;;
                102) reason=INFRA_PULL ;;
                103) reason=INFRA_DEPLOY ;;
                104) reason=POST_BANNERS ;;
                105) reason=POST_DAILY_REPORT ;;
                106) reason=CHAT_ENCRYPTION_ACTIVATION ;;
                181) reason=PREFLIGHT_KEYRING_INVALID ;;
                182) reason=PREFLIGHT_KEY_CAPABILITY ;;
                183) reason=PREFLIGHT_CANDIDATE_PROOF ;;
                184) reason=PREFLIGHT_DOWNGRADE_FLOOR ;;
                185) reason=PREFLIGHT_DB_SCHEMA ;;
                186) reason=PREFLIGHT_OTHER ;;
                187) reason=PREFLIGHT_KEYRING_JSON ;;
                188) reason=PREFLIGHT_KEYRING_ENVIRONMENT ;;
                189) reason=PREFLIGHT_KEYRING_STRUCTURE ;;
                190) reason=PREFLIGHT_KEYRING_ENCODING ;;
                191) reason=PREFLIGHT_KEYRING_READ ;;
                192) reason=CRYPTO_BENCHMARK_FAILED ;;
                *) reason=UNCLASSIFIED ;;
              esac
              echo "DEV_SSM_FAILED:$status:$reason" >&2
              return 1
            fi
            if [ "$CRYPTO_BENCHMARK" = true ]; then
              local benchmark_file result
              benchmark_file="$(mktemp)"
              chmod 600 "$benchmark_file"
              if ! aws ssm get-command-invocation --region "$AWS_REGION" \
                --command-id "$cmd_id" --instance-id "$ID" \
                --query StandardOutputContent --output text >"$benchmark_file" 2>/dev/null; then
                rm -f "$benchmark_file"
                echo "DEV_CRYPTO_BENCHMARK_OUTPUT_UNAVAILABLE" >&2
                return 1
              fi
              if python - "$benchmark_file" <<'BENCHMARK_OUTPUT'
          import json
          import math
          from pathlib import Path
          import sys
          try:
              path = Path(sys.argv[1])
              if path.stat().st_size > 65_536:
                  raise ValueError()
              prefix = "CHAT_CRYPTO_BENCHMARK "
              lines = [line[len(prefix):] for line in path.read_text().splitlines() if line.startswith(prefix)]
              if len(lines) != 1:
                  raise ValueError()
              def pairs(items):
                  result = {}
                  for key, value in items:
                      if key in result:
                          raise ValueError()
                      result[key] = value
                  return result
              value = json.loads(lines[0], object_pairs_hook=pairs)
              names = ("encrypted_turn", "plaintext_turn", "added_turn", "encrypted_window_decode", "plaintext_window_read", "added_window_read")
              keys = {"samples", "warmup_samples", "window_messages", "message_chars", "storage_helpers_only"} | {
                  name + suffix for name in names for suffix in ("_median_ms", "_p95_ms")}

              if not isinstance(value, dict) or set(value) != keys:
                  raise ValueError()
              for key, item in value.items():
                  minimum = -1000 if key.startswith("added_") else 0
                  if type(item) not in (int, float) or not math.isfinite(item) or not minimum <= item <= 60_000:
                      raise ValueError()
              for key, expected in (("samples", 100), ("warmup_samples", 10), ("window_messages", 120), ("message_chars", 2000), ("storage_helpers_only", 1)):
                  if type(value[key]) is not int or value[key] != expected:
                      raise ValueError()
              if any(value[name + "_p95_ms"] < value[name + "_median_ms"] for name in names):
                  raise ValueError()
              print(prefix + json.dumps(value, sort_keys=True, allow_nan=False))
          except BaseException:
              raise SystemExit("DEV_CRYPTO_BENCHMARK_OUTPUT_INVALID") from None
          BENCHMARK_OUTPUT
              then result=0; else result=1; fi
              rm -f "$benchmark_file"
              [ "$result" = 0 ] || return 1
            fi
            echo "DEV_SSM_SUCCESS"
          }

          # JSON 인코딩은 고정 스크립트와 검증된 태그만 사용한다.
          params_file="$(mktemp)"
          trap 'rm -f "$params_file"' EXIT
          python - "$params_file" <<'PYTHON'
          import json
          import os
          import re
          import shlex
          import sys
          tag = os.environ["DEPLOY_TAG"]
          infra = os.environ["DEV_INFRA_SHA"]
          if not re.fullmatch(r"[0-9a-f]{40}", infra):
              raise SystemExit("REVIEWED_DEV_INFRA_SHA_REQUIRED")
          if not re.fullmatch(r"dev-[0-9a-f]{40}", tag):
              raise SystemExit("INVALID_DEV_IMAGE_TAG")
          preflight = os.environ.get("PREFLIGHT_ONLY", "false")
          if preflight not in {"true", "false"}:
              raise SystemExit("INVALID_PREFLIGHT_MODE")
          benchmark = os.environ.get("CRYPTO_BENCHMARK", "false")
          if benchmark not in {"true", "false"} or (benchmark == "true" and preflight != "true"):
              raise SystemExit("CRYPTO_BENCHMARK_PREFLIGHT_REQUIRED")
          container_probe = """import hashlib
          import json
          import sys
          expected, base = sys.argv[1], int(sys.argv[2])
          try:
              from app.config import settings
              values = {
                  "database": settings.supabase_db_connection_string,
                  "environment": settings.environment,
                  "morning_push_enabled": settings.morning_push_enabled,
                  "fcm_project_id": settings.fcm_project_id,
                  "fcm_service_account_file": settings.fcm_service_account_file,
              }
              if type(values["morning_push_enabled"]) is not bool or any(
                  type(value) is not str for key, value in values.items() if key != "morning_push_enabled"
              ):
                  raise ValueError()
              version = settings.git_sha
              fingerprint = hashlib.sha256(json.dumps(values, sort_keys=True, separators=(",", ":")).encode()).hexdigest()
          except Exception:
              raise SystemExit(base + 1)
          if values["environment"] != "development":
              raise SystemExit(base + 2)
          if expected and version != expected:
              raise SystemExit(base + 4)
          print(fingerprint)
          """
          crypto_benchmark = """import json,math,statistics,sys,time,uuid
          try:
              from app.config import settings
              from app.core import content_crypto
              from app.services.chat_content_encryption import EncryptionMode
              from app.services import message_content
              if settings.environment != 'development' or settings.git_sha != sys.argv[1]:
                  raise ValueError()
              content_crypto.initialize_content_crypto(required_key_ids=(1,))
              modes = {'encrypted':EncryptionMode(True,1,1,(1,)), 'plaintext':EncryptionMode(False,1,1,(1,))}
              owner = uuid.UUID(int=1)
              text = '가' * 2000
              response = {'messages':[{'role':'user','content':text},{'role':'assistant','content':text}]}
              key, request_hash = 'synthetic-codec-benchmark', 'a' * 64
              windows = {name:[message_content.encode_message(user_id=owner,text=text,mode=mode) for _ in range(120)]
                         for name,mode in modes.items()}
              names = ('encrypted_turn','plaintext_turn','added_turn','encrypted_window_decode','plaintext_window_read','added_window_read')
              measurements = {name:[] for name in names}
              for sample in range(110):
                  turns,reads = {},{}
                  order = ('encrypted','plaintext') if sample % 2 == 0 else ('plaintext','encrypted')
                  for name in order:
                      mode = modes[name]
                      started = time.perf_counter_ns()
                      first = message_content.encode_message(user_id=owner,text=text,mode=mode)
                      second = message_content.encode_message(user_id=owner,text=text,mode=mode)
                      saved = message_content.encode_response(user_id=owner,key=key,request_hash=request_hash,response=response,mode=mode)
                      turns[name] = (time.perf_counter_ns() - started) / 1_000_000
                      for item in (first,second):
                          assert message_content.read_message_content(user_id=owner,legacy_text=item['content'],ciphertext=item['content_ciphertext'],chars=item['content_chars']) == text
                      assert message_content.read_response(user_id=owner,key=key,request_hash=request_hash,
                          version=saved['response_schema_version'],response=saved['response'],ciphertext=saved['response_ciphertext']) == response
                  for name in order:
                      started = time.perf_counter_ns()
                      decoded = [message_content.read_message_content(user_id=owner,legacy_text=item['content'],
                          ciphertext=item['content_ciphertext'],chars=item['content_chars']) for item in windows[name]]
                      reads[name] = (time.perf_counter_ns() - started) / 1_000_000
                      assert len(decoded) == 120 and all(value == text for value in decoded)
                  if sample >= 10:
                      for name,value in (('encrypted_turn',turns['encrypted']),('plaintext_turn',turns['plaintext']),
                              ('added_turn',turns['encrypted']-turns['plaintext']),
                              ('encrypted_window_decode',reads['encrypted']),('plaintext_window_read',reads['plaintext']),
                              ('added_window_read',reads['encrypted']-reads['plaintext'])):
                          measurements[name].append(value)
              result = {'samples':100,'warmup_samples':10,'window_messages':120,'message_chars':2000,'storage_helpers_only':1}
              for name,values in measurements.items():
                  result[name+'_median_ms'] = statistics.median(values)
                  result[name+'_p95_ms'] = sorted(values)[math.ceil(len(values)*.95)-1]
              assert all(type(value) in (int,float) and math.isfinite(value) for value in result.values())
              print('CHAT_CRYPTO_BENCHMARK ' + json.dumps(result,sort_keys=True,allow_nan=False))
          except BaseException:
              raise SystemExit(192) from None
          """
          benchmark_command = (f"docker exec moly-backend python -c {shlex.quote(crypto_benchmark)} {tag.removeprefix('dev-')} 2>/dev/null || exit 192"
                               if benchmark == "true" else "")
          keyring_reason = """import base64,json,re,sys
          def pairs(items):
              result={}
              for key,value in items:
                  if key in result: raise ValueError()
                  result[key]=value
              return result
          try:
              with open(sys.argv[1]) as source: raw=source.read(65537)
              if len(raw)>65536: raise ValueError()
              value=json.loads(raw,object_pairs_hook=pairs)
          except Exception:
              raise SystemExit(187)
          if not isinstance(value,dict): raise SystemExit(189)
          if value.get('environment')!='development': raise SystemExit(188)
          if set(value)!={'environment','keys'} or not isinstance(value['keys'],dict) or not value['keys']:
              raise SystemExit(189)
          seen=set()
          try:
              for number,encoded in value['keys'].items():
                  if not re.fullmatch(r'[1-9][0-9]{0,4}',number) or int(number)>65535 or not isinstance(encoded,str):
                      raise SystemExit(189)
                  decoded=base64.b64decode(encoded,validate=True)
                  if len(decoded)!=32 or base64.b64encode(decoded).decode('ascii')!=encoded or decoded in seen:
                      raise ValueError()
                  seen.add(decoded)
          except Exception:
              raise SystemExit(190)
          raise SystemExit(181)
          """
          activation_proof = "import json,sys;print(json.dumps(dict(api=json.load(open(sys.argv[1])),consumer=json.load(open(sys.argv[2])))))"
          command = f"""set -eu
          check_dev() {{
            phase="$1"
            expected="$2"
            if [ "$phase" = pre ]; then
              host_base=40; api_base=50; consumer_base=60
            else
              host_base=70; api_base=80; consumer_base=90
            fi
            test "$(cat /etc/moly-env 2>/dev/null)" = dev || return "$((host_base + 1))"
            worker_host=absent
            if [ -f /etc/moly-worker-host ]; then worker_host=present; fi
            if [ "$phase" = pre ]; then
              worker_host_before="$worker_host"
            else
              test "$worker_host" = "$worker_host_before" || return 74
            fi
            for container in moly-backend moly-consumer; do
              if [ "$container" = moly-backend ]; then base="$api_base"; else base="$consumer_base"; fi
              if fingerprint="$(docker exec "$container" python -c {shlex.quote(container_probe)} "$expected" "$base")"; then
                case "$fingerprint" in
                  *[!0-9a-f]*|"") return "$((base + 5))" ;;
                esac
                test "$(printf %s "$fingerprint" | wc -c)" -eq 64 || return "$((base + 5))"
                if [ "$phase" = pre ]; then
                  if [ "$container" = moly-backend ]; then api_before="$fingerprint"; else consumer_before="$fingerprint"; fi
                else
                  if [ "$container" = moly-backend ]; then before="$api_before"; else before="$consumer_before"; fi
                  test "$fingerprint" = "$before" || return "$((base + 3))"
                fi
              else
                result="$?"
                case "$result" in
                  "$((base + 1))"|"$((base + 2))"|"$((base + 4))") return "$result" ;;
                  *) return "$base" ;;
                esac
              fi
            done
          }}
          check_dev pre ''
          cd /root/moly-infra || exit 101
          test -z "$(git status --porcelain)" || exit 102
          test "$(git remote get-url origin)" = https://github.com/SOMA-OneTwoThree/moly-infra.git || exit 102
          git fetch origin refs/heads/feat/chat-encryption-dev-20261105 || exit 102
          test "$(git rev-parse FETCH_HEAD)" = {infra} || exit 102
          git checkout --detach {infra} || exit 102
          test "$(git rev-parse HEAD)" = {infra} || exit 102
          """
          if preflight == "true":
              command += f"""umask 077
          diagnostic_log="$(mktemp)"
          diagnostic_keyring=""
          trap 'rm -f "$diagnostic_log" "$diagnostic_keyring"' EXIT
          grep -q '^PREFLIGHT_ONLY=' deploy.sh && grep -q DEPLOY_PREFLIGHT_ONLY deploy.sh || exit 186
          if sudo env DEPLOY_PREFLIGHT_ONLY=1 bash deploy.sh {tag} >"$diagnostic_log" 2>&1; then
            {benchmark_command}
            exit 0
          fi
          if grep -qF 'ERROR: chat_content_keyring_invalid' "$diagnostic_log"; then
            diagnostic_keyring="$(mktemp)"
            if ! aws ssm get-parameter --name /moly/dev/chat-content-keyring --with-decryption --region ap-northeast-2 --query Parameter.Value --output text >"$diagnostic_keyring" 2>/dev/null; then exit 191; fi
            python3 -c {shlex.quote(keyring_reason)} "$diagnostic_keyring" >/dev/null 2>&1
            exit 181
          fi
          if grep -qF 'ERROR: chat content crypto key/capability preflight failed' "$diagnostic_log"; then exit 182; fi
          if grep -qF 'ERROR: chat content crypto candidate proof invalid' "$diagnostic_log"; then exit 183; fi
          if grep -qF 'ERROR: chat content encryption downgrade floor rejected candidate' "$diagnostic_log"; then exit 184; fi
          if grep -qF '==> DB schema preflight' "$diagnostic_log"; then exit 185; fi
          exit 186
          """
          else:
              command += f"""          sudo bash deploy.sh {tag} || exit 103
          check_dev post {tag.removeprefix("dev-")}
          docker exec moly-backend sh -ec 'if [ -f scripts/check_running_banners.py ]; then python scripts/check_running_banners.py; fi' || exit 104
          if [ "{os.environ['VERIFY_DAILY_REPORT']}" = true ]; then
            docker exec moly-backend python scripts/check_daily_report.py --environment development --expected-sha {tag.removeprefix("dev-")} || exit 105
          fi
          python3 -c {shlex.quote(activation_proof)} .deploy-state/chat-content-moly-backend.json .deploy-state/chat-content-moly-consumer.json | docker exec -i moly-backend python scripts/activate_chat_content_crypto_dev.py --expected-sha {tag.removeprefix("dev-")} || exit 106
          """
          with open(sys.argv[1], "w") as out:
              json.dump({"commands": [command], "executionTimeout": ["1200"]}, out)
          PYTHON
          if ! CMD_ID="$(aws ssm send-command --region "$AWS_REGION" \
            --instance-ids "$ID" --document-name AWS-RunShellScript \
            --parameters "file://$params_file" \
            --query Command.CommandId --output text 2>/dev/null)"; then
            echo "DEV_SSM_SEND_FAILED" >&2
            exit 1
          fi
          if [[ ! "$CMD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "DEV_SSM_INVALID_COMMAND_ID" >&2
            exit 1
          fi
          poll_ssm "$CMD_ID"

      - name: Verify via public endpoint
        if: ${{ !inputs.preflight_only }}
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json
          import os
          import re
          import time
          import urllib.request
          expected = os.environ["DEPLOY_TAG"].removeprefix("dev-")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("INVALID_DEV_IMAGE_TAG")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def read(path):
              with opener.open("https://dev.moly.asia" + path, timeout=10) as response:
                  body = response.read(8193)
                  if response.status != 200 or len(body) > 8192:
                      raise ValueError("invalid response")
                  result = json.loads(body)
                  if not isinstance(result, dict):
                      raise ValueError("invalid response")
                  return result
          for attempt in range(6):
              try:
                  health = read("/health")
                  ready = read("/health/ready")
                  if (health.get("status") == "ok" and health.get("env") == "development"
                      and health.get("version") == expected and ready.get("status") == "ok"
                      and ready.get("db") == "ok" and ready.get("version") == expected):
                      print("DEV_PUBLIC_HEALTH_READY_OK")
                      break
              except Exception:
                  pass
              if attempt < 5:
                  time.sleep(5)
          else:
              raise SystemExit("DEV_PUBLIC_HEALTH_READY_FAILED")
          PYTHON
