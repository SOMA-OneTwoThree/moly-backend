name: Deploy dev (moly-backend)

# dev 브랜치 push → dev 이미지 빌드(별도 ECR: moly-backend-dev) → dev EC2 1대에 중단배포.
#
# prod 롤링배포(deploy.yml)와 완전 분리 — 상호작용 지점 0:
#   - 별도 IAM 역할 moly-github-actions-dev-role: trust가 dev 브랜치 sub만 허용,
#     SendCommand는 tag:Role=moly-backend-dev 인스턴스만, ELB 권한 없음
#     (dev 워크플로가 prod TG를 조작하는 것이 IAM 레벨에서 불가능)
#   - 별도 ECR 레포(보관 5개) — prod 레포의 롤백 풀(30개)을 잠식하지 않음
#   - 대상 발견 태그가 달라(deploy.yml=moly-backend) 서로의 인스턴스를 볼 수 없음
#
# 중단배포: deregister/drain 없음 — 배포 중 몇십 초 끊김은 dev에서 허용.
# dev 서버가 꺼져 있으면 발견 0대로 명확히 실패 — 서버 켠 뒤 Actions에서 Re-run.
#
# workflow_dispatch: image_tag에 기존 dev-<sha>를 주면 빌드 없이 그 이미지로 재배포(롤백).
on:
  push:
    branches: [dev]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그(dev-<sha> 전체). 비우면 현재 커밋을 빌드해서 배포"
        required: false
        default: ""

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-moly-backend-dev
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_NAME: moly-backend-dev
  ROLE_ARN: arn:aws:iam::676972757138:role/moly-github-actions-dev-role
  # dev- 접두사: prod sha 태그와 네임스페이스를 시각적으로도 구분
  DEPLOY_TAG: ${{ inputs.image_tag || format('dev-{0}', github.sha) }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Validate dev deployment target
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [[ "$REF_NAME" != "refs/heads/dev" ]] || [[ ! "$EVENT_NAME" =~ ^(push|workflow_dispatch)$ ]]; then
            echo "DEV_REF_REQUIRED" >&2
            exit 1
          fi
          if [[ ! "$DEPLOY_TAG" =~ ^dev-[0-9a-f]{40}$ ]]; then
            echo "INVALID_DEV_IMAGE_TAG" >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # dispatch로 기존 태그를 지정한 경우 빌드 스킵 — 롤백은 빌드가 아니라 재배포다
      - name: Build and push image
        if: ${{ inputs.image_tag == '' || github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.DEPLOY_TAG }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          # scope=dev: 레포 공용 10GB 캐시에서 prod 빌드 캐시를 LRU 축출하지 않도록 분리
          cache-from: type=gha,scope=dev
          cache-to: type=gha,mode=max,scope=dev

      - name: Validate deployed banner catalog and assets
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$IMAGE_NAME:$DEPLOY_TAG"
          if ! docker pull "$image" >/dev/null 2>&1; then
            echo "DEV_IMAGE_PULL_FAILED" >&2
            exit 1
          fi
          if ! docker run --rm --entrypoint sh "$image" -ec '
            if [ -f app/services/banner_catalog.py ]; then
              python scripts/validate_banners.py --assets --environment dev
            fi
          ' >/dev/null 2>&1; then
            echo "DEV_BANNER_VALIDATION_FAILED" >&2
            exit 1
          fi

      - name: Deploy via SSM (single dev instance)
        run: |
          set -euo pipefail
          if ! aws ecr describe-images --region "$AWS_REGION" \
            --repository-name "$IMAGE_NAME" \
            --image-ids imageTag="$DEPLOY_TAG" >/dev/null 2>&1; then
            echo "DEV_IMAGE_NOT_FOUND" >&2
            exit 1
          fi
          if ! IDS="$(aws ec2 describe-instances --region "$AWS_REGION" \
            --filters "Name=tag:Role,Values=moly-backend-dev" \
                      "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text 2>/dev/null)"; then
            echo "DEV_TARGET_LOOKUP_FAILED" >&2
            exit 1
          fi
          if [[ ! "$IDS" =~ ^i-[0-9a-f]+$ ]]; then
            echo "DEV_SINGLE_TARGET_REQUIRED" >&2
            exit 1
          fi
          ID="$IDS"

          # 원격 출력에는 설정/자격 정보가 섞일 수 있어 상태 enum만 노출한다.
          poll_ssm() {
            local cmd_id="$1" status="Pending" query_fails=0 finished=0 i err_file
            err_file="$(mktemp)"
            for i in $(seq 1 60); do
              sleep 10
              if status="$(aws ssm get-command-invocation --region "$AWS_REGION" \
                --command-id "$cmd_id" --instance-id "$ID" \
                --query Status --output text 2>"$err_file")"; then
                query_fails=0
                case "$status" in
                  Success|Failed|Cancelled|TimedOut) finished=1; break ;;
                  Pending|InProgress|Delayed|Cancelling) ;;
                  *) rm -f "$err_file"; echo "DEV_SSM_INVALID_STATUS" >&2; return 1 ;;
                esac
                echo "DEV_SSM_PENDING"
              elif [ "$i" -le 3 ] && grep -q InvocationDoesNotExist "$err_file"; then
                echo "DEV_SSM_PENDING"
              else
                query_fails=$((query_fails + 1))
                if [ "$query_fails" -ge 3 ]; then
                  rm -f "$err_file"
                  echo "DEV_SSM_STATUS_UNAVAILABLE" >&2
                  return 1
                fi
              fi
            done
            rm -f "$err_file"
            if [ "$finished" -ne 1 ]; then
              echo "DEV_SSM_TIMEOUT" >&2
              return 1
            fi
            if [ "$status" != Success ]; then
              echo "DEV_SSM_FAILED:$status" >&2
              return 1
            fi
            echo "DEV_SSM_SUCCESS"
          }

          # JSON 인코딩은 고정 스크립트와 검증된 태그만 사용한다.
          params_file="$(mktemp)"
          trap 'rm -f "$params_file"' EXIT
          python - "$params_file" <<'PYTHON'
          import json
          import os
          import re
          import sys
          tag = os.environ["DEPLOY_TAG"]
          if not re.fullmatch(r"dev-[0-9a-f]{40}", tag):
              raise SystemExit("INVALID_DEV_IMAGE_TAG")
          command = """set -eu
          check_dev() {
            expected="${1:-}"
            test "$(cat /etc/moly-env 2>/dev/null)" = dev
            test "$(systemctl is-active moly-worker.timer 2>/dev/null || true)" = inactive
            for container in moly-backend moly-consumer; do
              docker exec "$container" python -c 'import sys; from pathlib import Path; from app.config import settings; assert settings.environment == "development"; assert not settings.morning_push_enabled; assert not settings.fcm_project_id; credential = settings.fcm_service_account_file; assert not credential or not Path(credential).exists() or (Path(credential).is_file() and Path(credential).stat().st_size == 0); assert not sys.argv[1] or settings.git_sha == sys.argv[1]' "$expected"
            done
          }
          check_dev
          cd /root/moly-infra
          git pull --ff-only
          sudo bash deploy.sh """ + tag + """
          check_dev """ + tag.removeprefix("dev-") + """
          docker exec moly-backend sh -ec 'if [ -f scripts/check_running_banners.py ]; then python scripts/check_running_banners.py; fi'
          """
          with open(sys.argv[1], "w") as out:
              json.dump({"commands": [command], "executionTimeout": ["600"]}, out)
          PYTHON
          if ! CMD_ID="$(aws ssm send-command --region "$AWS_REGION" \
            --instance-ids "$ID" --document-name AWS-RunShellScript \
            --parameters "file://$params_file" \
            --query Command.CommandId --output text 2>/dev/null)"; then
            echo "DEV_SSM_SEND_FAILED" >&2
            exit 1
          fi
          if [[ ! "$CMD_ID" =~ ^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$ ]]; then
            echo "DEV_SSM_INVALID_COMMAND_ID" >&2
            exit 1
          fi
          poll_ssm "$CMD_ID"

      - name: Verify via public endpoint
        run: |
          set -euo pipefail
          python - <<'PYTHON'
          import json
          import os
          import re
          import time
          import urllib.request
          expected = os.environ["DEPLOY_TAG"].removeprefix("dev-")
          if not re.fullmatch(r"[0-9a-f]{40}", expected):
              raise SystemExit("INVALID_DEV_IMAGE_TAG")
          class NoRedirect(urllib.request.HTTPRedirectHandler):
              def redirect_request(self, req, fp, code, msg, headers, newurl):
                  return None
          opener = urllib.request.build_opener(NoRedirect)
          def read(path):
              with opener.open("https://dev.moly.asia" + path, timeout=10) as response:
                  body = response.read(8193)
                  if response.status != 200 or len(body) > 8192:
                      raise ValueError("invalid response")
                  result = json.loads(body)
                  if not isinstance(result, dict):
                      raise ValueError("invalid response")
                  return result
          for attempt in range(6):
              try:
                  health = read("/health")
                  ready = read("/health/ready")
                  if (health.get("status") == "ok" and health.get("env") == "development"
                      and health.get("version") == expected and ready.get("status") == "ok"
                      and ready.get("db") == "ok" and ready.get("version") == expected):
                      print("DEV_PUBLIC_HEALTH_READY_OK")
                      break
              except Exception:
                  pass
              if attempt < 5:
                  time.sleep(5)
          else:
              raise SystemExit("DEV_PUBLIC_HEALTH_READY_FAILED")
          PYTHON
