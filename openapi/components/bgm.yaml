schemas:
  BgmTrack:
    additionalProperties: false
    properties:
      id:
        pattern: ^[a-z0-9][a-z0-9-]{0,63}$
        title: Id
        type: string
      category:
        enum:
        - lofi
        - white_noise
        title: Category
        type: string
      title:
        maxLength: 120
        minLength: 1
        title: Title
        type: string
      source:
        enum:
        - bundled
        - remote
        title: Source
        type: string
      revision:
        pattern: ^[a-zA-Z0-9][a-zA-Z0-9._-]{0,63}$
        title: Revision
        type: string
      url:
        anyOf:
        - type: string
        - type: 'null'
        title: Url
      sha256:
        anyOf:
        - pattern: ^[a-f0-9]{64}$
          type: string
        - type: 'null'
        title: Sha256
      size_bytes:
        anyOf:
        - exclusiveMinimum: 0
          maximum: 104857600
          type: integer
        - type: 'null'
        title: Size Bytes
      mime_type:
        anyOf:
        - enum:
          - audio/mp4
          - audio/mpeg
          - audio/wav
          type: string
        - type: 'null'
        title: Mime Type
      sort_order:
        minimum: 0
        title: Sort Order
        type: integer
    required:
    - id
    - category
    - title
    - source
    - revision
    - url
    - sha256
    - size_bytes
    - mime_type
    - sort_order
    title: BgmTrack
    type: object
  BgmTracksResponse:
    properties:
      schema_version:
        const: 1
        default: 1
        title: Schema Version
        type: integer
      revision:
        pattern: ^[a-f0-9]{64}$
        title: Revision
        type: string
      tracks:
        items:
          $ref: '#/schemas/BgmTrack'
        title: Tracks
        type: array
    required:
    - revision
    - tracks
    title: BgmTracksResponse
    type: object
