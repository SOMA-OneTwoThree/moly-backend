name: Recover mood diary schema (temporary)
run-name: Mood DB recovery ${{ inputs.target }} ${{ inputs.mode }} ${{ inputs.confirm_sha256 }}

# Remove after recovery. Never called by push or by the deployment workflows.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Environment (dev must succeed before prod)
        type: choice
        options: [dev, prod]
        required: true
      mode:
        description: Dry-run rolls back; commit applies and verifies; verify only reads
        type: choice
        options: [dry-run, commit, verify]
        required: true
      confirm_sha256:
        description: Reviewed SQL SHA-256
        type: string
        required: true

permissions:
  contents: read
  actions: read
  id-token: write

concurrency:
  group: ${{ inputs.target == 'prod' && 'deploy-moly-backend' || 'deploy-moly-backend-dev' }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  TARGET: ${{ inputs.target }}
  MODE: ${{ inputs.mode }}
  SQL_SHA: e487644863cdaf8325d1269051d4c5079f4d19a7f723ca578e6d6e84d6dea342
  ECR_REGISTRY: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com
  ROLE_NAME: ${{ inputs.target == 'prod' && 'moly-github-actions-role' || 'moly-github-actions-dev-role' }}
  IMAGE_REPO: ${{ inputs.target == 'prod' && 'moly-backend' || 'moly-backend-dev' }}
  IMAGE_TAG: ${{ inputs.target == 'prod' && 'd8572220fe4c0fa4b5b6dfa974a1e51031453997' || 'dev-b964ee5f327f6ba8b9d57afd9a2e761c79d39c35' }}

jobs:
  recover:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Validate branch and reviewed checksum
        env:
          CONFIRM_SHA: ${{ inputs.confirm_sha256 }}
        run: |
          set -euo pipefail
          case "$TARGET:$GITHUB_REF" in
            dev:refs/heads/dev|prod:refs/heads/main) ;;
            *) echo 'Environment requires its actual deployment branch'; exit 1 ;;
          esac
          case "$MODE" in dry-run|commit|verify) ;; *) exit 1 ;; esac
          test "$CONFIRM_SHA" = "$SQL_SHA"

      - name: Require successful dev commit with identical recovery workflow
        if: inputs.target == 'prod'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PYTHON'
          import base64, json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          path = '.github/workflows/recover-mood-schema.yml'
          def api(path):
              return json.loads(subprocess.check_output(['gh', 'api', f'repos/{repo}/{path}']))
          def source(ref):
              return base64.b64decode(api(f'contents/{path}?ref={ref}')['content'])
          expected = source(os.environ['GITHUB_SHA'])
          title = f"Mood DB recovery dev commit {os.environ['SQL_SHA']}"
          runs = api('actions/workflows/recover-mood-schema.yml/runs?branch=dev&event=workflow_dispatch&status=success&per_page=100')['workflow_runs']
          for run in runs:
              if run['display_title'] == title and source(run['head_sha']) == expected:
                  print(f"Verified successful dev commit and schema verification: run {run['id']}")
                  break
          else:
              raise SystemExit('No successful dev commit with identical workflow; prod blocked')
          PYTHON

      # Fixed reviewed source and image: no arbitrary command, SQL or image inputs.
      - uses: actions/checkout@v4
        with:
          ref: d8572220fe4c0fa4b5b6dfa974a1e51031453997

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::676972757138:role/${{ env.ROLE_NAME }}
          aws-region: ${{ env.AWS_REGION }}
          allowed-account-ids: '676972757138'

      - name: Validate assumed role and instance count
        run: |
          set -euo pipefail
          ARN="$(aws sts get-caller-identity --query Arn --output text)"
          case "$ARN" in "arn:aws:sts::676972757138:assumed-role/$ROLE_NAME/"*) ;; *) exit 1 ;; esac
          IDS="$(aws ec2 describe-instances --filters \
            "Name=tag:Role,Values=$IMAGE_REPO" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text)"
          read -r -a instances <<< "$IDS"
          expected=1
          if [ "$TARGET" = prod ]; then expected=2; fi
          test "${#instances[@]}" -eq "$expected"
          # Shared DB: execute once, after validating every discovered target's tag/count.
          printf 'INSTANCE_ID=%s\n' "${instances[0]}" >> "$GITHUB_ENV"

      - name: Prepare bounded SSM command
        run: |
          cat > /tmp/mood-reviewed.sql <<'SQL'
          -- Review artifact: add public.mood_entries to an existing moly-backend environment.
          -- Target: existing schema matching the pre-change schema contract; no application data changes.
          -- Expected affected rows: 0; creates an empty table and its primary-key index.
          -- Locks: ACCESS EXCLUSIVE on the new table; FK creation also locks profiles briefly.
          -- Limits: lock_timeout=2s and statement_timeout=60s; retry later if locks are unavailable.
          -- Mixed versions: additive table; old application versions continue without using it.
          -- Rollback before feature writes: DROP TABLE public.mood_entries (new table/index/FK/ACL/RLS only).
          -- After feature writes, reverting the app can leave this table intact; dropping it loses diary data.
          -- Run through db.apply only after review and target approval; baseline replay is forbidden.
          SET LOCAL lock_timeout = '2s';
          SET LOCAL statement_timeout = '60s';
          
          -- TABLE: public.mood_entries
          CREATE TABLE public.mood_entries (
              user_id uuid NOT NULL,
              entry_date date NOT NULL,
              kind text NOT NULL,
              note text DEFAULT ''::text NOT NULL,
              created_at timestamp with time zone DEFAULT now() NOT NULL,
              updated_at timestamp with time zone DEFAULT now() NOT NULL
          );
          
          -- CONSTRAINT: public.mood_entries mood_entries_pkey
          ALTER TABLE ONLY public.mood_entries
              ADD CONSTRAINT mood_entries_pkey PRIMARY KEY (user_id, entry_date);
          
          -- FK CONSTRAINT: public.mood_entries mood_entries_user_id_fkey
          ALTER TABLE ONLY public.mood_entries
              ADD CONSTRAINT mood_entries_user_id_fkey FOREIGN KEY (user_id) REFERENCES public.profiles(id) ON DELETE CASCADE;
          
          -- ROW SECURITY: public.mood_entries
          ALTER TABLE public.mood_entries ENABLE ROW LEVEL SECURITY;
          
          -- ACL: public.TABLE mood_entries
          REVOKE ALL ON TABLE public.mood_entries FROM PUBLIC, anon, authenticated, service_role;
          GRANT ALL ON TABLE public.mood_entries TO service_role;
          SQL
          python3 - <<'PYTHON'
          import base64, hashlib, io, json, os, tarfile
          from pathlib import Path
          sql = Path('/tmp/mood-reviewed.sql').read_bytes()
          assert hashlib.sha256(sql).hexdigest() == os.environ['SQL_SHA']
          contract = json.loads(Path('db/schema_contract.json').read_text())['catalog']
          # Exact new-table fragment from the pinned reviewed main contract.
          fragment = {section: {key: value for key, value in entries.items()
                      if key.startswith('public.mood_entries')}
                      for section, entries in contract.items()}
          Path('/tmp/mood-contract.json').write_text(json.dumps(fragment))
          payload = io.BytesIO()
          with tarfile.open(fileobj=payload, mode='w:gz') as archive:
              for name in ('apply.py', 'envfile.py'):
                  archive.add(f'db/{name}', arcname=f'db/{name}')
              archive.add('/tmp/mood-reviewed.sql', arcname='reviewed.sql')
              archive.add('/tmp/mood-contract.json', arcname='mood-contract.json')
          encoded = base64.b64encode(payload.getvalue()).decode()
          target, mode = os.environ['TARGET'], os.environ['MODE']
          image = f"{os.environ['ECR_REGISTRY']}/{os.environ['IMAGE_REPO']}:{os.environ['IMAGE_TAG']}"
          script = r"""set -euo pipefail
          umask 077
          target=__TARGET__
          mode=__MODE__
          marker=prod
          if [ -e /etc/moly-env ]; then marker="$(cat /etc/moly-env)"; fi
          test "$marker" = "$target"
          tmp="$(mktemp -d /tmp/moly-mood-recovery.XXXXXX)"
          trap 'rm -rf "$tmp"' EXIT
          printf '%s' '__PAYLOAD__' | base64 -d | tar xz -C "$tmp"
          # Use the instance role's existing GetParametersByPath permission. Secrets stay here.
          aws ssm get-parameters-by-path --region ap-northeast-2 \
            --path "/moly/$target/" --recursive --with-decryption --output json > "$tmp/parameters.json"
          aws ecr get-login-password --region ap-northeast-2 | \
            docker login --username AWS --password-stdin 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com >/dev/null
          docker pull __IMAGE__ >/dev/null
          docker run --rm --user 0 --entrypoint python -i \
            -v "$tmp:/recovery" -v "$tmp/db/apply.py:/app/db/apply.py:ro" \
            -v "$tmp/db/envfile.py:/app/db/envfile.py:ro" \
            __IMAGE__ - "$target" "$mode" <<'REMOTE_PY'
          import asyncio, json, os, sys
          from pathlib import Path
          from urllib.parse import urlsplit
          from db.apply import apply
          from db.envfile import DEV_PROJECT_REFS, load_conn, project_ref
          from db.schema_contract import load_contract
          from db.catalog import compare_catalog, read_catalog
          import asyncpg
          async def recover():
              target, mode = sys.argv[1:]
              params = json.loads(Path('/recovery/parameters.json').read_text())['Parameters']
              values = {p['Name']: p['Value'] for p in params}
              prefix = f'/moly/{target}/'
              dsn = values[prefix + 'supabase-db-connection-string']
              url = values[prefix + 'supabase-url']
              ref = project_ref(dsn)
              if ref == 'unknown' or urlsplit(url).hostname != f'{ref}.supabase.co':
                  raise ValueError('SSM project identity mismatch')
              if (target == 'dev') != (ref in DEV_PROJECT_REFS):
                  raise ValueError('Environment project identity mismatch')
              if '\n' in dsn or '\r' in dsn:
                  raise ValueError('Invalid DSN format')
              env = f'/recovery/.env{ ".prod" if target == "prod" else ""}'
              # dotenv single quotes preserve literal password characters; no interpolation.
              value = dsn.replace('\\', '\\\\').replace("'", "\\'")
              Path(env).write_text("SUPABASE_DB_CONNECTION_STRING='" + value + "'\n")
              os.chmod(env, 0o600)
              Path('/recovery/parameters.json').unlink()
              actual_dsn = load_conn(env)
              if actual_dsn != dsn.replace('postgresql+asyncpg://', 'postgresql://', 1):
                  raise ValueError('DSN serialization mismatch')
              expected = load_contract()
              fragment = json.loads(Path('/recovery/mood-contract.json').read_text())
              # Keep each fixed image's complete baseline, adding only the reviewed table.
              for section, entries in fragment.items():
                  expected[section].update(entries)
              async def check(contract):
                  conn = await asyncpg.connect(actual_dsn, statement_cache_size=0, timeout=10)
                  try:
                      actual = await read_catalog(conn)
                  finally:
                      await conn.close()
                  return compare_catalog(contract, actual, strict=False)
              if mode != 'verify':
                  # Refuse unrelated baseline drift before any DDL.
                  baseline = {section: {key: value for key, value in entries.items()
                              if key not in fragment[section]}
                              for section, entries in expected.items()}
                  problems = await check(baseline)
                  if problems:
                      print('Unrelated schema drift; no SQL applied')
                      for problem in problems:
                          print(problem)
                      return 1
                  # Commit always repeats the dry-run immediately before applying the same SQL.
                  await apply(Path('/recovery/reviewed.sql'), env, expected_sha256='__SHA__')
                  if mode == 'dry-run':
                      return 0
                  await apply(Path('/recovery/reviewed.sql'), env, commit=True,
                              allow_prod=target == 'prod', expected_sha256='__SHA__')
              problems = await check(expected)
              for problem in problems:
                  print(problem)
              if not problems:
                  print('Full environment baseline plus reviewed mood_entries contract OK')
              return int(bool(problems))
          try:
              result = asyncio.run(recover())
          except BaseException as exc:
              print(f'Recovery failed ({type(exc).__name__}); secret details suppressed')
              result = 1
          sys.exit(result)
          REMOTE_PY
          """
          for key, value in {'__TARGET__': target, '__MODE__': mode, '__PAYLOAD__': encoded,
                             '__IMAGE__': image, '__SHA__': os.environ['SQL_SHA']}.items():
              script = script.replace(key, value)
          # SSM invokes sh; explicitly run the payload in bash for pipefail and EXIT cleanup.
          command = "bash <<'MOOD_RECOVERY_SCRIPT'\n" + script + 'MOOD_RECOVERY_SCRIPT\n'
          assert len(command.encode()) < 24000, 'SSM command exceeds size budget'
          Path('/tmp/mood-command.json').write_text(json.dumps({'commands': [command], 'executionTimeout': ['600']}))
          PYTHON

      - name: Run recovery once via SSM and verify completion
        run: |
          set -euo pipefail
          command_id="$(aws ssm send-command --instance-ids "$INSTANCE_ID" \
            --document-name AWS-RunShellScript --parameters file:///tmp/mood-command.json \
            --query Command.CommandId --output text)"
          echo "SSM command: $command_id; instance: $INSTANCE_ID"
          status=Pending
          for attempt in $(seq 1 70); do
            sleep 10
            if status="$(aws ssm get-command-invocation --command-id "$command_id" \
              --instance-id "$INSTANCE_ID" --query Status --output text 2>/tmp/mood-poll-error)"; then
              case "$status" in Success|Failed|Cancelled|TimedOut) break ;; esac
            elif [ "$attempt" -gt 3 ] || ! grep -q InvocationDoesNotExist /tmp/mood-poll-error; then
              cat /tmp/mood-poll-error >&2
              exit 1
            fi
          done
          aws ssm get-command-invocation --command-id "$command_id" --instance-id "$INSTANCE_ID" \
            --query StandardOutputContent --output text
          # Avoid dumping stderr: AWS/Docker/connection exceptions may contain sensitive details.
          echo "Recovery status: $status"
          test "$status" = Success
