/daily-affirmation:
  get:
    tags: [affirmation]
    summary: 오늘의 글귀 조회
    operationId: getDailyAffirmation
    description: >-
      현지 날짜로 고른 공용 문장을 요청 언어로 반환한다. 같은 현지 날짜에는 모든 사용자가 같은 문장을 받으며
      DB·배치·LLM을 사용하지 않는다. 읽기 전용이라 확인 기록을 만들지 않는다.
    parameters:
    - {$ref: '#/parameters/AppLocale'}
    - {$ref: '#/parameters/AppTimezone'}
    responses:
      '200':
        description: 오늘의 문장과 당일 확인 여부
        headers:
          Cache-Control:
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema: {$ref: ../components/affirmation.yaml#/schemas/DailyAffirmationResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/common.yaml#/responses/ProfileNotFound}
      '409':
        description: 계정 삭제 진행 중
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              accountDeleting:
                summary: 계정 삭제 진행 중
                value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
      '422':
        description: 요청 형식 또는 시간대 검증 실패
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              validation:
                summary: 요청 검증
                value:
                  error:
                    code: VALIDATION
                    message: 요청 형식이 올바르지 않습니다.
                    details:
                      errors:
                      - loc: [header, x-app-locale]
                        type: string_too_long
                        msg: String should have at most 64 characters
              appTimezoneInvalid:
                summary: 시간대 형식 오류
                value: {error: {code: APP_TIMEZONE_INVALID, message: 시간대 형식이 올바르지 않습니다., details: {}}}
    security: [{SupabaseBearer: []}]

/daily-affirmation/acknowledge:
  post:
    tags: [affirmation]
    summary: 오늘의 글귀 확인 기록
    operationId: acknowledgeDailyAffirmation
    description: >-
      오늘의 글귀를 확인했음을 유저 × 현지 날짜 1행에 기록한다. 멱등이며 같은 날짜로 다시 호출해도 200이다.
      기록 이후 홈 배너의 오늘의 글귀 카드는 다음 현지 자정까지 제외된다.
    parameters:
    - {$ref: '#/parameters/AppTimezone'}
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../components/affirmation.yaml#/schemas/DailyAffirmationAcknowledgeRequest}
    responses:
      '200':
        description: 확인 기록 완료
        headers:
          Cache-Control:
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema: {$ref: ../components/affirmation.yaml#/schemas/DailyAffirmationAcknowledgeResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/common.yaml#/responses/ProfileNotFound}
      '409':
        description: 현지 날짜가 바뀌었거나 계정 삭제 진행 중
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              dailyAffirmationStale:
                summary: 현지 날짜 전환
                value: {error: {code: DAILY_AFFIRMATION_STALE, message: 날짜가 바뀌었어요. 오늘의 글귀를 다시 확인해 주세요., details: {}}}
              accountDeleting:
                summary: 계정 삭제 진행 중
                value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
      '422':
        description: 요청 형식 또는 시간대 검증 실패
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              validation:
                summary: 요청 검증
                value:
                  error:
                    code: VALIDATION
                    message: 요청 형식이 올바르지 않습니다.
                    details:
                      errors:
                      - loc: [body, local_date]
                        type: missing
                        msg: Field required
              appTimezoneInvalid:
                summary: 시간대 형식 오류
                value: {error: {code: APP_TIMEZONE_INVALID, message: 시간대 형식이 올바르지 않습니다., details: {}}}
    security: [{SupabaseBearer: []}]

parameters:
  AppLocale:
    name: X-App-Locale
    in: header
    required: false
    description: >-
      글귀 언어. ko, en, ja 또는 해당 언어의 지역 태그(예: ko-KR, en-US, ja-JP)를 최대 64자로 받는다.
      미설정·미지원 언어는 en으로 폴백하며 응답의 locale은 ko, en, ja 중 하나다.
    schema:
      anyOf:
      - type: string
        maxLength: 64
      - type: 'null'
  AppTimezone:
    name: X-App-Timezone
    in: header
    required: false
    description: 현재 기기의 IANA 시간대 1..64자. 생략 시 profiles.timezone, 잘못된 값은 422 APP_TIMEZONE_INVALID.
    schema:
      anyOf:
      - type: string
      - type: 'null'
