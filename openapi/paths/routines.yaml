            examples:
              completed:
                summary: 완료한 루틴
                value:
                  error:
                    code: ROUTINE_ALREADY_COMPLETED
                    message: 완료한 루틴은 건너뛸 수 없어요.
                    details: {}
      '422':
        $ref: ../components/common.yaml#/responses/Validation
  delete:
    tags:
    - routine
    summary: 오늘 루틴 건너뛰기 취소
    operationId: unskipRoutine
    security:
    - SupabaseBearer: []
    description: 요청의 현지 날짜의 스킵을 지운다. 스킵이 없어도 204다.
    parameters:
    - name: routine_id
      in: path
      required: true
      schema:
        type: string
        title: Routine Id
      description: UUID string. 형식이 잘못돼도 404로 처리한다.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    responses:
      '204':
        description: 스킵 취소; body 없음
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        description: profile이 없거나 routine UUID/소유/삭제 상태가 유효하지 않음
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              profile:
                summary: 프로필 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 프로필을 찾을 수 없어요.
                    details: {}
              routine:
                summary: 루틴 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 루틴을 찾을 수 없어요.
                    details: {}
      '422':
        $ref: ../components/common.yaml#/responses/Validation
/routine-templates:
  get:
    tags:
    - routine
    summary: 루틴 템플릿 목록
    operationId: listRoutineTemplates
    security:
    - SupabaseBearer: []
    description: 서버가 관리하는 활성 카테고리·템플릿을 sort_order 순으로 프로필 언어로 현지화해 반환한다.
    responses:
      '200':
        description: 템플릿 목록
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineTemplatesResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
/routine-templates/selection:
  post:
    tags:
    - routine
    summary: 루틴 템플릿 선택
    operationId: selectRoutineTemplates
    security:
    - SupabaseBearer: []
    description: 고른 템플릿으로 루틴을 카테고리·템플릿 순서대로 만들고 이번에 만든 루틴만 반환한다. 이미 추가된(삭제하지 않은
      같은 템플릿 루틴이 있는) 템플릿은 건너뛴다. 이름은 프로필 언어 값(없으면 한국어), 알림은 꺼짐, 요일 이력은 요청의 현지
      날짜부터다. 빈 배열은 건너뛰기이며, 처음 호출이면 selection_completed를 true로 만든다. 없거나 비활성인 id가 하나라도 있으면
      아무것도 만들지 않고 422다.
    parameters:
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/routines.yaml#/schemas/RoutineTemplateSelectionRequest
    responses:
      '200':
        description: 이번에 만든 루틴
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineListResponse
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        description: 요청 형식 오류 또는 없거나 비활성인 템플릿 id
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              requestValidation:
                summary: 요청 검증
                value:
                  error:
                    code: VALIDATION
                    message: 요청 형식이 올바르지 않습니다.
                    details:
                      errors:
                      - loc:
                        - body
                        - template_ids
                        type: value_error
                        msg: 'Value error, template_ids는 중복 없이 보내야 해요.'
              unknownTemplate:
                summary: 없거나 비활성인 템플릿
                value:
                  error:
                    code: VALIDATION
                    message: 추가할 수 없는 템플릿이에요.
                    details:
                      template_ids:
                      - unknown_template
