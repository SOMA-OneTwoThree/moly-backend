/daily-fortune/reveal:
  post:
    tags: [fortune]
    summary: 오늘 운세 계산·공개
    operationId: revealDailyFortune
    parameters:
    - {$ref: '#/parameters/AppLocale'}
    responses:
      '200':
        description: 공개 결과 또는 광고 잠금 상태
