/fortune-profile:
  get:
    tags: [fortune]
    summary: 운세 프로필 조회
    operationId: getFortuneProfile
    responses:
      '200':
        description: 저장된 계산 프로필
        content:
          application/json:
            schema: {$ref: ../components/fortune.yaml#/schemas/FortuneProfileResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '403':
        description: 개발 기능이 비활성화됨
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              featureUnavailable:
                summary: 개발 기능 비활성
                value: {error: {code: FEATURE_UNAVAILABLE, message: 오늘의 운세 기능을 사용할 수 없어요., details: {}}}
      '404':
        description: 운세 프로필을 아직 입력하지 않음
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              profileRequired:
                summary: 운세 프로필 미입력
                value: {error: {code: PROFILE_REQUIRED, message: 운세 정보를 먼저 입력해 주세요., details: {}}}
      '409':
        description: 계정 삭제 진행 중
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              accountDeleting:
                summary: 계정 삭제 진행 중
                value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
    security: [{SupabaseBearer: []}]
  put:
    tags: [fortune]
    summary: 운세 프로필 저장
    operationId: putFortuneProfile
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../components/fortune.yaml#/schemas/FortuneProfilePut}
    responses:
      '200':
        description: 저장된 계산 프로필
        content:
          application/json:
            schema: {$ref: ../components/fortune.yaml#/schemas/FortuneProfilePutResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '403':
        description: 개발 기능이 비활성화됨
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              featureUnavailable:
                summary: 개발 기능 비활성
                value: {error: {code: FEATURE_UNAVAILABLE, message: 오늘의 운세 기능을 사용할 수 없어요., details: {}}}
      '422':
        description: 요청 형식 또는 생년월일 정책 위반
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              validation:
                summary: 요청 형식 오류
                value:
                  error:
                    code: VALIDATION
                    message: 요청 형식이 올바르지 않습니다.
                    details:
                      errors:
                      - loc: [body, birth_date]
                        type: missing
                        msg: Field required
              invalidBirthDate:
                summary: 지원 범위보다 오래된 생년월일
                value: {error: {code: INVALID_BIRTH_DATE, message: 지원하지 않는 생년월일이에요., details: {}}}
              underMinimumAge:
                summary: 만 14세 미만
                value: {error: {code: UNDER_MINIMUM_AGE, message: 만 14세 이상만 사용할 수 있어요., details: {}}}
      '409':
        description: 계정 삭제 진행 중
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              accountDeleting:
                summary: 계정 삭제 진행 중
                value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
    security: [{SupabaseBearer: []}]
  delete:
    tags: [fortune]
    summary: 운세 프로필 삭제
    operationId: deleteFortuneProfile
    responses:
      '204': {description: 삭제 완료; 이미 없어도 동일}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '403':
        description: 개발 기능이 비활성화됨
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              featureUnavailable:
                summary: 개발 기능 비활성
                value: {error: {code: FEATURE_UNAVAILABLE, message: 오늘의 운세 기능을 사용할 수 없어요., details: {}}}
      '409':
        description: 계정 삭제 진행 중
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              accountDeleting:
                summary: 계정 삭제 진행 중
                value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
    security: [{SupabaseBearer: []}]

