schemas:
  CreateRoutineRequest:
    properties:
      name:
        type: string
        maxLength: 50
        minLength: 1
        title: Name
      days_of_week:
        items:
          $ref: '#/schemas/DayOfWeek'
        type: array
        title: Days Of Week
        minItems: 1
        maxItems: 7
        uniqueItems: true
        description: ISO weekday 1=Mon…7=Sun, 중복 없이 1개 이상. 입력 후 정렬.
      reminder_enabled:
        type: boolean
        title: Reminder Enabled
        default: false
      reminder_time:
        anyOf:
        - type: string
          format: time
        - type: 'null'
        title: Reminder Time
        description: ISO time 문자열 또는 null.
      icon:
        $ref: '#/schemas/RoutineIcon'
        default: seedling
      color:
        $ref: '#/schemas/RoutineColor'
        default: peach
    additionalProperties: false
    type: object
    required:
    - name
    - days_of_week
    title: CreateRoutineRequest
  DayOfWeek:
    type: integer
    enum:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    - 7
    title: DayOfWeek
    description: ISO weekday. 1=월 … 7=일.
  PatchRoutineRequest:
    properties:
      name:
        anyOf:
        - type: string
          maxLength: 50
          minLength: 1
        - type: 'null'
        title: Name
      days_of_week:
        anyOf:
        - items:
            $ref: '#/schemas/DayOfWeek'
          type: array
          minItems: 1
          maxItems: 7
          uniqueItems: true
        - type: 'null'
        title: Days Of Week
        description: 생략/null은 변경 없음. 배열이면 중복 없이 1개 이상이고 정렬.
      reminder_enabled:
        anyOf:
        - type: boolean
        - type: 'null'
        title: Reminder Enabled
        description: false를 보내면 client local reminder를 비활성화한다. 생략/null은 변경 없음.
      reminder_time:
        anyOf:
        - type: string
          format: time
        - type: 'null'
        title: Reminder Time
        description: ISO time 문자열. 생략은 변경 없음, null은 기존 시간 제거.
      icon:
        anyOf:
        - $ref: '#/schemas/RoutineIcon'
        - type: 'null'
        description: 생략/null은 변경 없음.
      color:
        anyOf:
        - $ref: '#/schemas/RoutineColor'
        - type: 'null'
        description: 생략/null은 변경 없음.
    additionalProperties: false
    type: object
    title: PatchRoutineRequest
  RoutineCompleteResponse:
    properties:
      completed_today:
        type: boolean
        const: true
        title: Completed Today
      completed_count_today:
        type: integer
        minimum: 0
        title: Completed Count Today
    type: object
    required:
    - completed_today
    - completed_count_today
    title: RoutineCompleteResponse
  RoutineListResponse:
    properties:
      data:
        items:
          $ref: '#/schemas/RoutineResponse'
        type: array
        title: Data
    type: object
    required:
    - data
    title: RoutineListResponse
  RoutinePairStatus:
    properties:
      completed_today:
        type: integer
        minimum: 0
        title: Completed Today
      required:
        type: integer
        minimum: 0
        title: Required
        description: 현재 필요 완료 수 2.
      claimable:
        type: boolean
        title: Claimable
      claimed:
        type: boolean
        title: Claimed
      reward:
        type: integer
        minimum: 0
        title: Reward
        description: 현재 routine 보상 20.
    type: object
    required:
    - completed_today
    - required
    - claimable
    - claimed
    - reward
    title: RoutinePairStatus
  RoutineResponse:
    properties:
      id:
        type: string
        format: uuid
        title: Id
        description: Routine UUID.
      name:
        type: string
        maxLength: 50
        minLength: 1
        title: Name
        description: Routine 이름.
      icon:
        $ref: '#/schemas/RoutineIcon'
      color:
        $ref: '#/schemas/RoutineColor'
      template_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Template Id
        description: 템플릿으로 만든 루틴이면 템플릿 id, 아니면 null.
      frequency_per_week:
        type: integer
        maximum: 7
        minimum: 1
        title: Frequency Per Week
        description: 항상 days_of_week 길이인 compatibility field.
      days_of_week:
        type: array
        minItems: 1
        maxItems: 7
        uniqueItems: true
        items:
          $ref: '#/schemas/DayOfWeek'
        description: ISO weekday 1=Mon…7=Sun, 중복 없이 1개 이상.
      reminder_enabled:
        type: boolean
        title: Reminder Enabled
        description: client local reminder 활성 여부.
      reminder_time:
        anyOf:
        - type: string
          pattern: ^\d{2}:\d{2}$
        - type: 'null'
        title: Reminder Time
        description: HH:MM response string 또는 null.
      completed_today:
        type: boolean
        title: Completed Today
        description: local reward date 완료 여부.
      skipped_today:
        type: boolean
        title: Skipped Today
        description: local reward date에 스킵했고 완료하지 않았으면 true.
    type: object
    required:
    - id
    - name
    - icon
    - color
    - template_id
    - frequency_per_week
    - days_of_week
    - reminder_enabled
    - reminder_time
    - completed_today
    - skipped_today
    title: RoutineResponse
  RoutineStatisticsResponse:
    properties:
      streak:
        type: integer
        minimum: 0
        title: Streak
        description: 오늘부터 역방향 연속 calendar day 완료 수.
      completed_today:
        type: boolean
        title: Completed Today
        description: 오늘 완료 여부.
      target_count:
        type: integer
        maximum: 7
        minimum: 1
        title: Target Count
        description: 항상 days_of_week 길이.
      days_of_week:
        type: array
        minItems: 1
        maxItems: 7
        uniqueItems: true
        items:
          $ref: '#/schemas/DayOfWeek'
        description: ISO weekday 배열.
      this_week:
        $ref: '#/schemas/ThisWeekStatistics'
        description: 월요일 시작 현재 주 완료 통계.
      last_30_days:
        items:
          type: string
          format: date
        type: array
        title: Last 30 Days
        description: (today-date).days<30인 완료 date를 오름차순 반환.
      completion_rate:
        type: number
        maximum: 1
        minimum: 0
        title: Completion Rate
        description: 최근 28일 완료 수/(요일 수×4), 최대 1, 소수 둘째 자리 반올림. 부동소수점 표현 때문에 0.01 배수 검증은 하지 않는다.
    type: object
    required:
    - streak
    - completed_today
    - target_count
    - days_of_week
    - this_week
    - last_30_days
    - completion_rate
    title: RoutineStatisticsResponse
  ThisWeekStatistics:
    properties:
      completed_count:
        type: integer
        minimum: 0
        title: Completed Count
      by_weekday:
        $ref: '#/schemas/WeekdayCompletion'
    type: object
    required:
    - completed_count
    - by_weekday
    title: ThisWeekStatistics
  WeekdayCompletion:
    properties:
      '1':
        type: boolean
        title: '1'
      '2':
        type: boolean
        title: '2'
      '3':
        type: boolean
        title: '3'
      '4':
        type: boolean
        title: '4'
      '5':
        type: boolean
        title: '5'
      '6':
        type: boolean
        title: '6'
      '7':
        type: boolean
        title: '7'
    type: object
    required:
    - '1'
    - '2'
    - '3'
    - '4'
    - '5'
    - '6'
    - '7'
    title: WeekdayCompletion
  RoutineHistoryItem:
    type: object
    properties:
      id:
        type: string
        format: uuid
        title: Id
        description: Routine UUID.
      name:
        type: string
        maxLength: 50
        minLength: 1
        title: Name
        description: Routine 이름.
      icon:
        $ref: '#/schemas/RoutineIcon'
      color:
        $ref: '#/schemas/RoutineColor'
      days_of_week:
        type: array
        minItems: 1
        maxItems: 7
        uniqueItems: true
        items:
          $ref: '#/schemas/DayOfWeek'
        description: 선택일에 적용된 요일. ISO weekday 1=Mon…7=Sun.
      reminder_enabled:
        type: boolean
        title: Reminder Enabled
        description: client local reminder 활성 여부.
      reminder_time:
        anyOf:
        - type: string
          pattern: ^\d{2}:\d{2}$
        - type: 'null'
        title: Reminder Time
        description: HH:MM response string 또는 null.
      completed:
        type: boolean
        description: 선택 날짜의 실제 완료 여부.
      skipped:
        type: boolean
        description: 선택 날짜에 스킵했고 완료하지 않았으면 true.
      streak:
        type: integer
        minimum: 0
        description: 구버전 앱 호환 필드. 선택일(미완료면 전날)부터 역방향 연속 calendar day 완료 수.
      this_week:
        $ref: '#/schemas/ThisWeekStatistics'
        description: 구버전 앱 호환 필드. 선택 날짜가 속한 주의 월요일부터 선택일까지 완료 통계.
    required:
    - id
    - name
    - icon
    - color
    - days_of_week
    - reminder_enabled
    - reminder_time
    - completed
    - skipped
    - streak
    - this_week
    title: RoutineHistoryItem
  RoutineHistoryResponse:
    type: object
    properties:
      date:
        type: string
        format: date
      data:
        type: array
        items:
          $ref: '#/schemas/RoutineHistoryItem'
    required:
    - date
    - data
    title: RoutineHistoryResponse
  RoutineIcon:
    type: string
    pattern: ^[a-z0-9_]{1,64}$
    title: RoutineIcon
    description: 루틴 아이콘 키(Fluent Emoji 3D 폴더 이름 기반). 앱 카탈로그에 없는 키는 앱이 기본 아이콘으로 그린다.
  RoutineColor:
    type: string
    enum:
    - pink
    - peach
    - yellow
    - green
    - blue
    - mint
    - lavender
    title: RoutineColor
    description: 루틴 파스텔 색 키. 실제 색 값은 앱 테마가 정한다.
  RoutineStatsSummary:
    type: object
    properties:
      current_streak:
        type: integer
        minimum: 0
        description: 오늘부터 거꾸로 센 전체 스트릭. 완료가 있는 날 +1, 인스턴스가 없는 날과 아직 완료가 없는 오늘은 건너뛰고, 지난 날의 미완료에서 멈춘다.
      best_streak:
        type: integer
        minimum: 0
        description: 같은 규칙으로 전 기간에서 가장 긴 연속.
      perfect_days:
        type: integer
        minimum: 0
        description: 오늘 이하에서 scheduled > 0이고 completed == scheduled인 날 수.
      total_completed:
        type: integer
        minimum: 0
        description: 오늘 이하 완료 기록 수(삭제된 루틴 포함).
      completed_this_month:
        type: integer
        minimum: 0
        description: 이번 달(오늘이 속한 달) 완료 기록 수.
      overall_rate:
        anyOf:
        - type: number
          minimum: 0
          maximum: 1
        - type: 'null'
        description: 전 기간 달성률. 분모는 오늘 이전 인스턴스와 오늘 완료한 인스턴스, 분모가 0이면 null.
      monthly_rate:
        anyOf:
        - type: number
          minimum: 0
          maximum: 1
        - type: 'null'
        description: 이번 달 달성률. 계산 방식은 overall_rate와 같다.
    required:
    - current_streak
    - best_streak
    - perfect_days
    - total_completed
    - completed_this_month
    - overall_rate
    - monthly_rate
    title: RoutineStatsSummary
  RoutineStatsDay:
    type: object
    properties:
      date:
        type: string
        format: date
      scheduled:
        type: integer
        minimum: 0
        description: 그날 인스턴스 수. 예정이었고 스킵하지 않았거나 완료한 루틴(삭제된 루틴 포함).
      completed:
        type: integer
        minimum: 0
        description: 그날 완료 기록 수(삭제된 루틴 포함). 항상 scheduled 이하.
    required:
    - date
    - scheduled
    - completed
    title: RoutineStatsDay
  RoutineStatsItem:
    type: object
    properties:
      id:
        type: string
        format: uuid
        description: Routine UUID.
      name:
        type: string
        maxLength: 50
        minLength: 1
        description: 프로필 언어로 현지화한 이름.
      icon:
        $ref: '#/schemas/RoutineIcon'
      color:
        $ref: '#/schemas/RoutineColor'
      scheduled_dates:
        type: array
        items:
          type: string
          format: date
        description: 기간 안, 오늘 이하 인스턴스 날짜(완료일 포함, 스킵한 날 제외), 오름차순.
      completed_dates:
        type: array
        items:
          type: string
          format: date
        description: 기간 안 완료일, 오름차순.
      skipped_dates:
        type: array
        items:
          type: string
          format: date
        description: 기간 안, 오늘 이하에서 예정이었는데 스킵했고 완료하지 않은 날, 오름차순.
      current_streak:
        type: integer
        minimum: 0
        description: 이 루틴의 인스턴스만 본 현재 스트릭.
      best_streak:
        type: integer
        minimum: 0
      total_completed:
        type: integer
        minimum: 0
      completed_this_month:
        type: integer
        minimum: 0
      overall_rate:
        anyOf:
        - type: number
          minimum: 0
          maximum: 1
        - type: 'null'
        description: 이 루틴의 전 기간 달성률. 분모가 0이면 null.
    required:
    - id
    - name
    - icon
    - color
    - scheduled_dates
    - completed_dates
    - skipped_dates
    - current_streak
    - best_streak
    - total_completed
    - completed_this_month
    - overall_rate
    title: RoutineStatsItem
  RoutineStatsResponse:
    type: object
    properties:
      today:
        type: string
        format: date
        description: 계산에 쓴 요청 시점 현지 날짜.
      summary:
        $ref: '#/schemas/RoutineStatsSummary'
      days:
        type: array
        items:
          $ref: '#/schemas/RoutineStatsDay'
        description: from부터 min(to, today)까지 모든 날짜, 오름차순. from이 today보다 뒤면 빈 배열.
      routines:
        type: array
        items:
          $ref: '#/schemas/RoutineStatsItem'
        description: 삭제하지 않은 현재 루틴, GET /routines와 같은 순서.
    required:
    - today
    - summary
    - days
    - routines
    title: RoutineStatsResponse
  RoutineTemplate:
    type: object
    properties:
      id:
        type: string
        pattern: ^[a-z0-9_]{1,64}$
      name:
        type: string
        maxLength: 50
        minLength: 1
        description: 프로필 언어 이름. 없으면 한국어.
      icon:
        $ref: '#/schemas/RoutineIcon'
      color:
        $ref: '#/schemas/RoutineColor'
      days_of_week:
        type: array
        minItems: 1
        maxItems: 7
        uniqueItems: true
        items:
          $ref: '#/schemas/DayOfWeek'
      recommended:
        type: boolean
        description: 처음 화면에서 미리 체크할 추천 템플릿.
      added:
        type: boolean
        description: 이 템플릿으로 만든, 삭제하지 않은 루틴이 있으면 true.
    required:
    - id
    - name
    - icon
    - color
    - days_of_week
    - recommended
    - added
    title: RoutineTemplate
  RoutineTemplateCategory:
    type: object
    properties:
      id:
        type: string
        pattern: ^[a-z0-9_]{1,64}$
      name:
        type: string
        minLength: 1
        description: 프로필 언어 이름. 없으면 한국어.
      templates:
        type: array
        items:
          $ref: '#/schemas/RoutineTemplate'
    required:
    - id
    - name
    - templates
    title: RoutineTemplateCategory
  RoutineTemplatesResponse:
    type: object
    properties:
      selection_completed:
        type: boolean
        description: 템플릿 선택(건너뛰기 포함)을 한 번이라도 마쳤으면 true.
      categories:
        type: array
        items:
          $ref: '#/schemas/RoutineTemplateCategory'
        description: 활성 템플릿이 있는 활성 카테고리, 카테고리·템플릿 sort_order 순.
    required:
    - selection_completed
    - categories
    title: RoutineTemplatesResponse
  RoutineTemplateSelectionRequest:
    type: object
    properties:
      template_ids:
        type: array
        maxItems: 30
        uniqueItems: true
        items:
          type: string
          pattern: ^[a-z0-9_]{1,64}$
        description: 추가할 템플릿 id 0~30개, 중복 불가. 빈 배열은 건너뛰기다.
    additionalProperties: false
    required:
    - template_ids
    title: RoutineTemplateSelectionRequest
