schemas:
  DailyPracticeCategory:
    type: string
    enum:
    - rest
    - body
    - calm
    - mind
    - self_kindness
    - connect
    - order
    description: >-
      rest 잠과 쉬기, body 몸 움직이기, calm 스트레스와 불안, mind 생각 정리, self_kindness 나에게 다정하기,
      connect 누군가에게 연락하기, order 하루나 공간을 조금 정리하기.
  DailyPracticeStatus:
    type: string
    enum:
    - offered
    - accepted
    - completed
  DailyPractice:
    type: object
    additionalProperties: false
    required:
    - id
    - status
    - category
    - title
    - speech
    - icon
    - routine_added
    properties:
      id:
        type: string
        format: uuid
        description: 이 제안의 사용자 행 id. 풀 행동의 id가 아니다.
      status:
        $ref: '#/schemas/DailyPracticeStatus'
      category:
        $ref: '#/schemas/DailyPracticeCategory'
      title:
        type: string
        description: 요청 언어의 체크할 행동. 루틴 이름으로도 쓰인다.
      speech:
        type: string
        description: 제안할 때 캐피가 하는 말. 요청 언어.
      icon:
        type: string
        description: 루틴 아이콘 카탈로그의 키. routines.icon에 그대로 쓸 수 있다.
      routine_added:
        type: boolean
  DailyPracticeToday:
    type: object
    additionalProperties: false
    required:
    - local_date
    - expires_at
    - locale
    - practice
    - offers_remaining
    properties:
      local_date:
        type: string
        format: date
        description: 현재 행이 있으면 그 행을 만들 때 정한 현지 날짜, 없으면 요청 시간대의 오늘.
      expires_at:
        type: string
        format: date-time
        description: 다음 현지 자정의 시각. 현재 행이 있으면 그 행을 만들 때 정한 값이다.
      locale:
        type: string
        enum:
        - ko
        - en
        - ja
        description: 문구에 적용한 언어. 미설정·미지원 언어는 en이다.
      practice:
        anyOf:
        - $ref: '#/schemas/DailyPractice'
        - type: 'null'
        description: 현재 행. 아직 제안이 없거나 풀이 비어 있으면 null이다.
      offers_remaining:
        type: integer
        minimum: 0
        maximum: 2
        description: 오늘 더 건너뛸 수 있는 횟수(2, 1, 0). 수락한 뒤에는 0이다.
  DailyPracticeOfferRequest:
    type: object
    additionalProperties: false
    properties:
      focus:
        type: array
        maxItems: 3
        default: []
        items:
          $ref: '#/schemas/DailyPracticeCategory'
        description: 중요한 순서의 관심 카테고리. 선택에만 쓰고 저장하지 않는다.
  DailyPracticeRoutineResponse:
    type: object
    additionalProperties: false
    required:
    - today
    - routine
    properties:
      today:
        $ref: '#/schemas/DailyPracticeToday'
      routine:
        $ref: ./routines.yaml#/schemas/RoutineResponse
responses:
  Unprocessable:
    description: 요청 형식 또는 시간대 검증 실패
    content:
      application/json:
        schema: {$ref: ./common.yaml#/schemas/ErrorEnvelope}
        examples:
          validation:
            summary: 요청 검증
            value:
              error:
                code: VALIDATION
                message: 요청 형식이 올바르지 않습니다.
                details:
                  errors:
                  - loc: [header, x-app-locale]
                    type: string_too_long
                    msg: String should have at most 64 characters
          appTimezoneInvalid:
            summary: 시간대 형식 오류
            value: {error: {code: APP_TIMEZONE_INVALID, message: 시간대 형식이 올바르지 않습니다., details: {}}}
  ReadNotFound:
    description: 시간대 헤더가 없을 때의 프로필 없음
    content:
      application/json:
        schema: {$ref: ./common.yaml#/schemas/ErrorEnvelope}
        examples:
          profileNotFound:
            summary: 프로필 없음
            value: {error: {code: NOT_FOUND, message: 프로필을 찾을 수 없어요., details: {}}}
  AccountDeleting:
    description: 계정 삭제 진행 중
    content:
      application/json:
        schema: {$ref: ./common.yaml#/schemas/ErrorEnvelope}
        examples:
          accountDeleting:
            summary: 계정 삭제 진행 중
            value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
  PracticeNotFound:
    description: 없는 id이거나 다른 사용자의 id, 또는 시간대 헤더가 없을 때의 프로필 없음
    content:
      application/json:
        schema: {$ref: ./common.yaml#/schemas/ErrorEnvelope}
        examples:
          dailyPracticeNotFound:
            summary: 없는 실천
            value: {error: {code: DAILY_PRACTICE_NOT_FOUND, message: 오늘의 작은 실천을 찾을 수 없어요., details: {}}}
          profileNotFound:
            summary: 프로필 없음
            value: {error: {code: NOT_FOUND, message: 프로필을 찾을 수 없어요., details: {}}}
  TransitionConflict:
    description: 계정 삭제 중이거나 만료된 행, 또는 허용되지 않은 전이
    content:
      application/json:
        schema: {$ref: ./common.yaml#/schemas/ErrorEnvelope}
        examples:
          accountDeleting:
            summary: 계정 삭제 진행 중
            value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
          expired:
            summary: expires_at이 지난 행
            value: {error: {code: DAILY_PRACTICE_EXPIRED, message: 오늘의 작은 실천이 이미 끝났어요., details: {}}}
          invalidState:
            summary: 허용되지 않은 전이
            value: {error: {code: DAILY_PRACTICE_INVALID_STATE, message: 지금은 할 수 없는 동작이에요., details: {}}}
  SkipConflict:
    description: 계정 삭제 중이거나 만료된 행, 허용되지 않은 전이, 또는 건너뛰기 한도 초과
    content:
      application/json:
        schema: {$ref: ./common.yaml#/schemas/ErrorEnvelope}
        examples:
          accountDeleting:
            summary: 계정 삭제 진행 중
            value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
          expired:
            summary: expires_at이 지난 행
            value: {error: {code: DAILY_PRACTICE_EXPIRED, message: 오늘의 작은 실천이 이미 끝났어요., details: {}}}
          invalidState:
            summary: 허용되지 않은 전이
            value: {error: {code: DAILY_PRACTICE_INVALID_STATE, message: 지금은 할 수 없는 동작이에요., details: {}}}
          offerLimit:
            summary: 건너뛰기 한도 초과
            value: {error: {code: DAILY_PRACTICE_OFFER_LIMIT, message: 오늘은 더 바꿀 수 없어요., details: {}}}
parameters:
  PracticeId:
    name: id
    in: path
    required: true
    description: DailyPractice.id
    schema:
      type: string
      format: uuid
