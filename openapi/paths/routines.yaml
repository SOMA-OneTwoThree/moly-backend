/routines:
  get:
    tags:
    - routine
    summary: 루틴 목록 조회
    operationId: listRoutines
    responses:
      '200':
        description: 루틴 목록
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineListResponse
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        $ref: ../components/common.yaml#/responses/Validation
    security:
    - SupabaseBearer: []
    description: soft-delete되지 않은 본인 routine을 created_at, id 오름차순으로 모두 반환한다. pagination은
      없다. completed_today·skipped_today는 요청의 현지 날짜 기준이다.
    parameters:
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
  post:
    tags:
    - routine
    summary: 루틴 생성
    operationId: createRoutine
    requestBody:
      content:
        application/json:
          schema:
            $ref: ../components/routines.yaml#/schemas/CreateRoutineRequest
      required: true
    responses:
      '201':
        description: 생성된 루틴
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineResponse
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        $ref: ../components/common.yaml#/responses/Validation
    security:
    - SupabaseBearer: []
    description: days_of_week는 ISO 월=1…일=7 중복 없는 1개 이상이며 저장 전에 정렬된다. frequency_per_week는
      배열 길이로 파생된다. icon 기본값은 seedling, color 기본값은 peach다. 요일 이력은 요청의 현지 날짜부터
      시작한다.
    parameters:
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
/routines/{routine_id}:
  patch:
    tags:
    - routine
    summary: 루틴 수정
    operationId: updateRoutine
    security:
    - SupabaseBearer: []
    parameters:
    - name: routine_id
      in: path
      required: true
      schema:
        type: string
        title: Routine Id
      description: UUID string. 형식이 잘못돼도 404로 처리한다.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/routines.yaml#/schemas/PatchRoutineRequest
    responses:
      '204':
        description: 수정 완료; body 없음
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
      '404':
        description: UUID 형식 오류, 없음, 타인 소유 또는 soft-delete
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              notFound:
                summary: resource 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 루틴을 찾을 수 없어요.
                    details: {}
    description: body 자체는 필수지만 `{}`는 no-op 204다. name/reminder_enabled/days_of_week/icon/color의
      null은 변경 없음. reminder_time은 생략하면 변경 없고 명시적 null이면 제거한다. days_of_week를 바꾸면 frequency_per_week도
      길이로 갱신하고, 요청의 현지 날짜부터 새 요일을 적용한다. 그 전날까지의 기록은 바뀌지 않는다.
  delete:
    tags:
    - routine
    summary: 루틴 삭제
    operationId: deleteRoutine
    security:
    - SupabaseBearer: []
    parameters:
    - name: routine_id
      in: path
      required: true
      schema:
        type: string
        title: Routine Id
      description: UUID string. 형식이 잘못돼도 404로 처리한다.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    responses:
      '204':
        description: 삭제 완료; body 없음
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        description: UUID 형식 오류, 없음, 타인 소유 또는 soft-delete
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              notFound:
                summary: resource 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 루틴을 찾을 수 없어요.
                    details: {}
    description: deleted_at과 요청의 현지 날짜(deleted_on)를 기록하는 soft delete다. 그날부터 예정에서 빠지고 지난 기록은
      남는다.
/routines/{routine_id}/complete:
  post:
    tags:
    - routine
    summary: 오늘 루틴 완료
    operationId: completeRoutine
    security:
    - SupabaseBearer: []
    parameters:
    - name: routine_id
      in: path
      required: true
      schema:
        type: string
        title: Routine Id
      description: UUID string. 형식이 잘못돼도 404로 처리한다.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    responses:
      '200':
        description: 완료 상태와 오늘 전체 완료 수
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineCompleteResponse
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        description: profile이 없거나 routine UUID/소유/삭제 상태가 유효하지 않음
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              profile:
                summary: 프로필 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 프로필을 찾을 수 없어요.
                    details: {}
              routine:
                summary: 루틴 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 루틴을 찾을 수 없어요.
                    details: {}
      '422':
        $ref: ../components/common.yaml#/responses/Validation
    description: local 00:00 reward date 기준 완료를 insert하며 unique conflict를 무시하므로 멱등이다. 같은 날 스킵이
      있으면 지운다.
  delete:
    tags:
    - routine
    summary: 오늘 루틴 완료 취소
    operationId: uncompleteRoutine
    security:
    - SupabaseBearer: []
    parameters:
    - name: routine_id
      in: path
      required: true
      schema:
        type: string
        title: Routine Id
      description: UUID string. 형식이 잘못돼도 404로 처리한다.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    responses:
      '204':
        description: 완료 취소; body 없음
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        description: profile이 없거나 routine UUID/소유/삭제 상태가 유효하지 않음
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              profile:
                summary: 프로필 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 프로필을 찾을 수 없어요.
                    details: {}
              routine:
                summary: 루틴 없음
                value:
                  error:
                    code: NOT_FOUND
                    message: 루틴을 찾을 수 없어요.
                    details: {}
      '422':
        $ref: ../components/common.yaml#/responses/Validation
    description: 해당 reward date 완료 행이 없어도 204다.
