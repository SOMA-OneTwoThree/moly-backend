/wallet:
  get:
    tags:
    - economy
    summary: 건초 잔액 조회
    operationId: getWallet
    responses:
      '200':
        description: 현재 잔액
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/WalletResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
    security:
    - SupabaseBearer: []
    description: 서버 권위 profile의 hay balance를 반환한다.
/wallet/transactions:
  get:
    tags:
    - economy
    summary: 건초 원장 조회
    operationId: listWalletTransactions
    security:
    - SupabaseBearer: []
    parameters:
    - name: limit
      in: query
      required: false
      schema:
        type: integer
        maximum: 100
        minimum: 1
        default: 30
        title: Limit
      description: 최대 반환 개수.
    - name: cursor
      in: query
      required: false
      schema:
        type: string
        pattern: ^[0-9]+$
        title: Cursor
      description: 이 id보다 작은 거래를 조회하는 transaction id cursor. 십진 숫자([0-9]+)만 허용한다.
    responses:
      '200':
        description: 원장 거래 목록과 다음 cursor
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/TransactionsResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        description: query constraint 또는 cursor가 decimal integer가 아님
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              cursor:
                summary: cursor 오류
                value:
                  error:
                    code: VALIDATION
                    message: 잘못된 커서 형식이에요.
                    details: {}
              query:
                summary: query 검증
                value:
                  error:
                    code: VALIDATION
                    message: 요청 형식이 올바르지 않습니다.
                    details:
                      errors:
                      - loc:
                        - query
                        - limit
                        type: greater_than_equal
                        msg: Input should be greater than or equal to 1
    description: id 내림차순 cursor pagination. 다음 page가 실제로 있을 때만 next_cursor를 반환한다.
/charging-station:
  get:
    tags:
    - economy
    summary: 충전소 상태 조회
    operationId: getChargingStation
    responses:
      '200':
        description: 충전소 상태
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/ChargingStationResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
    security:
    - SupabaseBearer: []
    description: 출석, 광고, 루틴 2개 보상의 local 00:00 reward date 상태와 활성 hay pack, 잔액을 반환한다. activity_date field명은
      legacy다.
/charging-station/attendance:
  post:
    tags:
    - economy
    summary: 출석 보상 수령
    operationId: claimAttendanceReward
    responses:
      '200':
        description: 지급량과 지급 후 잔액
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/RewardResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '409':
        description: 같은 reward date에 이미 출석 보상을 수령함
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              claimed:
                summary: 이미 수령
                value:
                  error:
                    code: ALREADY_CLAIMED
                    message: 이미 수령했어요.
                    details: {}
    security:
    - SupabaseBearer: []
    description: 사용자 local 00:00 reward date마다 한 번 POST /attendance/check-in과 같은 연속 출석 지급량을 원장과 함께 지급한다.
/charging-station/routine-reward:
  post:
    tags:
    - economy
    summary: 루틴 2개 완료 보상 수령
    operationId: claimRoutineReward
    responses:
      '200':
        description: 지급량과 지급 후 잔액
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/RewardResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        description: 같은 reward date의 routine 완료가 2개 미만
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              goal:
                summary: 목표 미달
                value:
                  error:
                    code: ROUTINE_GOAL_NOT_MET
                    message: 루틴 2개를 아직 다 완료하지 않았어요.
                    details: {}
      '409':
        description: 같은 reward date에 이미 routine 보상을 수령함
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              claimed:
                summary: 이미 수령
                value:
                  error:
                    code: ALREADY_CLAIMED
                    message: 이미 수령했어요.
                    details: {}
    security:
    - SupabaseBearer: []
    description: 같은 local reward date에 routine 완료가 2개 이상이면 한 번 +20 건초를 지급한다.
/attendance:
  get:
    tags:
    - economy
    summary: 연속 출석 조회
    operationId: getAttendance
    security:
    - SupabaseBearer: []
    description: 날짜는 모두 사용자 local 00:00 reward date다. 출석한 날은 출석 보상을 받은 날이며, 첫 출석 체크 때 어제까지
      이어진 루틴 연속을 출석한 날로 한 번 옮겨 둔다(아직 체크 전이면 옮길 값을 미리 센다). 오늘 출석 전이면 어제까지의
      연속이 현재 연속이다. days는 from..to 안의 출석한 날 오름차순이며, from ≤ to이고 기간은 371일 이하여야 한다.
    parameters:
    - name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      description: YYYY-MM-DD 시작 날짜(포함).
    - name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      description: YYYY-MM-DD 끝 날짜(포함). from부터 371일 이하.
    responses:
      '200':
        description: 현재·최장 연속과 기간 안의 출석한 날
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/AttendanceResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        $ref: ../components/common.yaml#/responses/Validation
/attendance/check-in:
  post:
    tags:
    - economy
    summary: 출석 체크
    operationId: checkInAttendance
    security:
    - SupabaseBearer: []
    description: 앱 진입 출석. 오늘 reward date의 첫 요청이면 출석을 기록하고 오늘까지의 연속 출석 일수에 해당하는 건초(GET
      /charging-station attendance.streak_rewards, 20, 20, 40, 20, 20, 20, 100을 7일마다 되풀이)를 원장과 함께 지급한다. 이미 출석했으면 아무것도 바꾸지 않고
      checked_in=false로 현재 연속을 반환한다(멱등). POST /charging-station/attendance와 같은 출석 기록과 지급량을 공유하므로
      어느 쪽으로 받아도 하루 한 번이다.
    responses:
      '200':
        description: 이번 요청의 출석 여부, 지급량, 잔액과 연속
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/AttendanceCheckInResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
/reward-ad-sessions:
  post:
    tags:
    - ads
    summary: 리워드 광고 session 발급
    description: 광고 시청 전에 local reward date 일 5회 한도를 확인하고 30분 동안 유효한 SSV custom_data와 userIdentifier 값을 발급한다. 같은 사용자의 유효한 pending 세션은 재사용한다.
    operationId: createRewardAdSession
    responses:
      '200':
        description: SSV용 session과 현재 사용량
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/RewardAdSessionResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '429':
        description: 같은 reward date 광고 보상 사용량이 5회 이상
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              limit:
                summary: 광고 한도
                value:
                  error:
                    code: AD_LIMIT_REACHED
                    message: 오늘 광고 시청 한도에 도달했어요.
                    details: {}
    security:
    - SupabaseBearer: []
/webhooks/ad-ssv:
  get:
    tags:
    - ads
    summary: AdMob server-side verification callback
    description: 공개 HTTP endpoint지만 Google ECDSA signature가 권한 경계다. custom_data는 건초용 UUID 또는
      운세용 fortune:<UUID>다. 실제 보상은 두 경로 모두 user_id·ad_unit·reward_item·reward_amount까지 서명된
      query와 세션 소유자·서버 placement/reward 계약을 대조한다. 서명된 AdMob URL 확인 요청에 실제 세션 또는 거래 ID가 없으면 보상 없이 200 invalid_session으로
      종결한다. signature 통과 후 영구 실패/중복도 Google 재시도를 피하기 위해 항상 200이고 result로 구분한다.
      verifier key timeout은 10초, cache TTL은 24시간이다. signature와 key_id는 각각 정확히 한 번, 마지막 두
      query로 이 순서에 있어야 한다. 그 뒤 suffix와 ad_network·ad_unit·custom_data·reward_amount·reward_item·timestamp·transaction_id·user_id
      중복은 거절하며 business field는 검증을 통과한 signature 앞 원본 query에서만 파싱한다. 추가 query는 signature
      앞 원본 query에 있을 때만 서명 대상에 포함된다.
    operationId: handleAdMobSsv
    responses:
      '200':
        description: SSV 처리 결과
        content:
          application/json:
            schema:
              $ref: ../components/economy.yaml#/schemas/AdSsvResponse
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '422':
        description: signature/key 누락·empty, 잘못된 마지막 순서·suffix·critical duplicate, 크기 제한 초과 또는 Google SSV signature/key 검증 실패
        content:
          application/json:
            schema:
              $ref: ../components/common.yaml#/schemas/ErrorEnvelope
            examples:
              missing:
                summary: parameter 누락
                value:
                  error:
                    code: VALIDATION
                    message: SSV 파라미터가 누락됐어요.
                    details: {}
              signature:
                summary: signature 실패
                value:
                  error:
                    code: AD_VERIFY_FAILED
                    message: 광고 시청 확인에 실패했어요.
                    details: {}
              envelope:
                summary: signature/key_id 뒤 suffix 또는 critical field 중복
                value:
                  error:
                    code: AD_VERIFY_FAILED
                    message: 광고 시청 확인에 실패했어요.
                    details: {}
    security:
    - AdMobSsvSignature: []
    parameters:
    - name: key_id
      in: query
      required: true
      description: Google verifier 공개키 식별자. non-empty string만 검사한다.
      schema:
        type: string
        minLength: 1
    - name: custom_data
      in: query
      required: false
      description: 건초는 reward_session_id UUID, 운세는 fortune:<fortune_session_uuid>. 검증된 signed prefix에서만 읽는다. AdMob URL 확인 요청에서 생략될 수 있으며, 누락·형식 오류는 signature 통과 후 200 result=invalid_session.
      schema:
        type: string
        minLength: 1
    - name: transaction_id
      in: query
      required: false
      description: 검증된 signed prefix의 AdMob SSV transaction id. 실제 보상에서는 unique 멱등 key이며, URL 확인 요청에서 누락되면 보상 없이 200으로 종결한다.
      schema:
        type: string
        minLength: 1
    - name: user_id
      in: query
      required: false
      description: 실제 건초·운세 보상에서 필수인 AdMob SSV user_id. 서버가 세션 소유자 UUID와 대조한다. URL 확인 요청에서는 생략될 수 있다.
      schema: {type: string, format: uuid}
    - name: ad_unit
      in: query
      required: false
      description: 실제 보상에서 필수. 보상 종류별 서버 placement allowlist와 대조한다.
      schema: {type: string, minLength: 1}
    - name: reward_item
      in: query
      required: false
      description: 실제 보상에서 필수. 건초·운세 보상 종류별 서버 계약값과 대조한다.
      schema: {type: string, minLength: 1}
    - name: reward_amount
      in: query
      required: false
      description: 실제 보상에서 필수. 보상 종류별 서버 계약 정수값과 대조한다.
      schema: {type: string, pattern: '^[0-9]+$'}
