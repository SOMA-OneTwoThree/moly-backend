schemas:
  DailyAffirmationItem:
    type: object
    additionalProperties: false
    required:
    - id
    - text
    properties:
      id:
        type: string
        minLength: 1
        maxLength: 64
        description: 문장 식별자. app/resources/affirmations.json의 항목 id다.
      text:
        type: string
        minLength: 1
        maxLength: 200
        description: 요청 언어로 완성된 문장. 서버가 고른 결과이며 클라가 다시 선택하지 않는다.
  DailyAffirmationResponse:
    type: object
    additionalProperties: false
    required:
    - local_date
    - locale
    - affirmation
    - acknowledged
    properties:
      local_date:
        type: string
        format: date
        description: 검증한 X-App-Timezone(생략 시 profiles.timezone) 기준 현지 달력일.
      locale:
        type: string
        enum:
        - ko
        - en
        - ja
        description: 문장에 적용한 언어. 미설정·미지원 언어는 en이다.
      affirmation:
        $ref: '#/schemas/DailyAffirmationItem'
      acknowledged:
        type: boolean
        description: 같은 현지 날짜에 이미 확인했으면 true. true면 홈 배너에서 오늘의 글귀 카드를 제외한다.
  DailyAffirmationAcknowledgeRequest:
    type: object
    additionalProperties: false
    required:
    - local_date
    properties:
      local_date:
        type: string
        format: date
        description: 확인한 문장의 현지 날짜. 서버가 계산한 오늘과 다르면 409 DAILY_AFFIRMATION_STALE.
  DailyAffirmationAcknowledgeResponse:
    type: object
    additionalProperties: false
    required:
    - local_date
    - acknowledged
    properties:
      local_date:
        type: string
        format: date
      acknowledged:
        type: boolean
        const: true
        description: 기록 완료. 같은 날짜로 다시 호출해도 200이며 첫 확인 시각을 덮어쓰지 않는다.
