name: Build and Deploy (moly-backend)

# main에 push되면: 이미지 빌드 → ECR push → 인스턴스별 순차 롤링 배포
# (deregister → drain → SSM deploy.sh <sha> → register → healthy 대기)
#
# workflow_dispatch = 비상 탈출구 (Actions 탭 → Run workflow):
#   - image_tag에 이전 sha 입력 → 빌드 없이 그 이미지로 즉시 롤백 배포
#   - 인스턴스 1대 장애 중 핫픽스가 필요하면 expected_instances=1로 가드 완화
#     (⚠ 1로 내리면 남은 1대를 롤링하는 동안 TG가 순간 비므로, ALB 장애 페이지를
#      감수한다는 판단일 때만. 원칙은 인스턴스 복구가 먼저다)
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "배포할 이미지 태그(git sha 전체). 비우면 현재 커밋을 빌드해서 배포"
        required: false
        default: ""
      expected_instances:
        description: "예상 인스턴스 수 (1대 장애 대응 시에만 1로)"
        required: false
        default: "2"

# OIDC로 AWS에 인증하려면 id-token: write 가 필수
permissions:
  id-token: write
  contents: read

# 롤링 배포 도중 취소되면 한 대가 deregister된 채 방치(조용한 50% 장애)되므로
# 취소하지 않고 순서대로 완주한다. 연속 push는 큐잉됨.
concurrency:
  group: deploy-moly-backend
  cancel-in-progress: false

env:
  AWS_REGION: ap-northeast-2
  ECR_REGISTRY: 676972757138.dkr.ecr.ap-northeast-2.amazonaws.com
  IMAGE_NAME: moly-backend
  ROLE_ARN: arn:aws:iam::676972757138:role/moly-github-actions-role
  TG_ARN: arn:aws:elasticloadbalancing:ap-northeast-2:676972757138:targetgroup/moly-backend-tg/5d725ff95a85e070
  # 배포 대상은 tag:Role=moly-backend로 발견한다(하드코딩 인스턴스 ID 없음).
  # 단, 발견 수가 EXPECTED_INSTANCES와 다르면 즉시 중단 — 태그 누락/인스턴스 중지 시
  # 1대만 롤링하면 TG가 비어 전면 503, 0대면 아무것도 배포 안 된 채 초록불이 된다.
  EXPECTED_INSTANCES: ${{ inputs.expected_instances || '2' }}
  # 배포 태그: dispatch에서 image_tag를 주면 그 태그(빌드 스킵 = 롤백), 아니면 현재 커밋
  DEPLOY_TAG: ${{ inputs.image_tag || github.sha }}

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      # 1. 코드 체크아웃
      - name: Checkout
        uses: actions/checkout@v4

      # 2. AWS OIDC 인증 (액세스 키 없음 — 역할을 그때그때 assume)
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      # 3. ECR 로그인
      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      # 4. Docker Buildx (gha 캐시로 빌드 가속)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 5. 이미지 빌드 & ECR push (latest + git sha 두 태그 — 배포는 sha 태그만 소비)
      #    dispatch로 image_tag(기존 이미지)를 지정한 경우 빌드 스킵 — 롤백은 빌드가 아니라 재배포다
      - name: Build and push image
        if: ${{ inputs.image_tag == '' || github.event_name == 'push' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.ECR_REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          build-args: |
            GIT_SHA=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Validate deployed banner catalog and assets
        run: |
          set -euo pipefail
          image="$ECR_REGISTRY/$IMAGE_NAME:$DEPLOY_TAG"
          docker pull "$image"
          docker run --rm --entrypoint sh "$image" -ec '
            if [ -f app/services/banner_catalog.py ]; then
              python scripts/validate_banners.py --assets
            else
              echo "Pre-SDUI rollback image: no banner endpoint"
            fi
          '

      # 6. 인스턴스별 순차 롤링 배포.
      #    ALB 헬스체크 감지(10s×2)만으로는 컨테이너 재시작 갭(10~30s)을 못 가리므로
      #    명시적 deregister로 트래픽을 뺀 뒤 배포한다. 첫 인스턴스가 실패하면 워크플로가
      #    중단되고 나머지는 구버전으로 계속 서비스한다(자동 부분 롤백). 실패한 인스턴스는
      #    deregister 상태로 남으므로 원인 확인 후 이전 sha로 재배포 + register가 수동 조치다.
      #    주의: SSM은 sh로 실행하므로 deploy.sh는 반드시 `bash deploy.sh`로 명시 실행
      - name: Rolling deploy via SSM
        run: |
          set -euo pipefail

          # --- SSM 명령 폴링(검증된 기존 로직의 함수화) ---
          #  - SendCommand 직후 InvocationDoesNotExist는 최초 3회(약 30초)까지 정상으로 간주
          #  - 그 외 조회 실패는 stderr를 드러내고 연속 3회면 즉시 실패 (조용히 위장 금지)
          poll_ssm() {
            local cmd_id="$1" instance_id="$2"
            local STATUS="Pending" GRACE_POLLS=3 MAX_QUERY_FAILS=3
            local query_fails=0 finished=0 i err_file err_msg
            for i in $(seq 1 60); do
              sleep 10
              err_file="$(mktemp)"
              if STATUS="$(aws ssm get-command-invocation \
                    --region "$AWS_REGION" \
                    --command-id "$cmd_id" \
                    --instance-id "$instance_id" \
                    --query "Status" \
                    --output text 2>"$err_file")"; then
                query_fails=0
                echo "  [$i] $instance_id status=$STATUS"
                case "$STATUS" in
                  Success|Failed|Cancelled|TimedOut) rm -f "$err_file"; finished=1; break ;;
                esac
              else
                err_msg="$(cat "$err_file")"
                if [ "$i" -le "$GRACE_POLLS" ] && printf '%s' "$err_msg" | grep -q "InvocationDoesNotExist"; then
                  echo "  [$i] status=Pending (invocation 등록 대기 중)"
                else
                  query_fails=$((query_fails + 1))
                  echo "  [$i] get-command-invocation 조회 실패 (${query_fails}/${MAX_QUERY_FAILS}):" >&2
                  printf '%s\n' "$err_msg" >&2
                  if [ "$query_fails" -ge "$MAX_QUERY_FAILS" ]; then
                    rm -f "$err_file"
                    echo "==> 조회 연속 ${MAX_QUERY_FAILS}회 실패 — 배포 상태 확인 불가, 실패 처리" >&2
                    return 1
                  fi
                fi
              fi
              rm -f "$err_file"
            done

            echo "==> [$instance_id] 배포 표준출력 ----------------------------"
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$cmd_id" --instance-id "$instance_id" \
              --query "StandardOutputContent" --output text || true
            echo "==> [$instance_id] 배포 표준에러 ----------------------------"
            aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$cmd_id" --instance-id "$instance_id" \
              --query "StandardErrorContent" --output text || true

            if [ "$finished" -ne 1 ]; then
              echo "[$instance_id] 배포 실패: 타임아웃 (마지막 status=$STATUS)" >&2
              return 1
            fi
            if [ "$STATUS" != "Success" ]; then
              echo "[$instance_id] 배포 실패 (status=$STATUS)" >&2
              return 1
            fi
          }

          echo "==> 배포 태그 존재 확인 (dispatch 오타로 deregister 후 pull 실패하는 사고 방지)"
          if ! aws ecr describe-images --region "$AWS_REGION" \
               --repository-name "$IMAGE_NAME" --image-ids imageTag="$DEPLOY_TAG" >/dev/null; then
            echo "ERROR: ECR에 ${IMAGE_NAME}:${DEPLOY_TAG} 없음 — image_tag 오타이거나 수명주기로 만료됨" >&2
            exit 1
          fi

          echo "==> 대상 인스턴스 발견 (tag:Role=moly-backend, running)"
          INSTANCE_IDS="$(aws ec2 describe-instances \
            --region "$AWS_REGION" \
            --filters "Name=tag:Role,Values=moly-backend" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' \
            --output text)"
          COUNT="$(echo $INSTANCE_IDS | wc -w)"
          echo "발견 ${COUNT}대: $INSTANCE_IDS"
          if [ "$COUNT" -ne "$EXPECTED_INSTANCES" ]; then
            echo "ERROR: 예상 ${EXPECTED_INSTANCES}대, 실제 ${COUNT}대 — 태그/인스턴스 상태 확인 후 재실행" >&2
            exit 1
          fi

          for ID in $INSTANCE_IDS; do
            echo "==> [$ID] deregister + drain 대기 (deregistration_delay 60s)"
            aws elbv2 deregister-targets --region "$AWS_REGION" \
              --target-group-arn "$TG_ARN" --targets Id="$ID"
            aws elbv2 wait target-deregistered --region "$AWS_REGION" \
              --target-group-arn "$TG_ARN" --targets Id="$ID"

            echo "==> [$ID] deploy.sh ${DEPLOY_TAG::7} 실행"
            CMD_ID="$(aws ssm send-command \
              --region "$AWS_REGION" \
              --instance-ids "$ID" \
              --document-name "AWS-RunShellScript" \
              --comment "Deploy moly-backend ${DEPLOY_TAG::7}" \
              --parameters "commands=[\"cd /root/moly-infra && git pull --ff-only && sudo bash deploy.sh ${DEPLOY_TAG} && docker exec moly-backend sh -ec 'if [ -f scripts/check_running_banners.py ]; then python scripts/check_running_banners.py; fi'\"]" \
              --query "Command.CommandId" \
              --output text)"
            echo "CommandId: $CMD_ID"
            if ! poll_ssm "$CMD_ID" "$ID"; then
              echo "ERROR: [$ID] 배포 실패 — deregister 상태로 남음. 남은 인스턴스는 구버전으로 서비스 중." >&2
              echo "수동 조치: 원인 해결 후 'sudo bash deploy.sh <이전sha>' + register-targets" >&2
              exit 1
            fi

            echo "==> [$ID] register + healthy 대기"
            aws elbv2 register-targets --region "$AWS_REGION" \
              --target-group-arn "$TG_ARN" --targets Id="$ID"
            aws elbv2 wait target-in-service --region "$AWS_REGION" \
              --target-group-arn "$TG_ARN" --targets Id="$ID"
            echo "==> [$ID] 롤링 완료"
          done

          echo "==> 정합성 검증 1: 발견 인스턴스 수 == TG 등록 타깃 수"
          REGISTERED="$(aws elbv2 describe-target-health --region "$AWS_REGION" \
            --target-group-arn "$TG_ARN" \
            --query 'length(TargetHealthDescriptions)' --output text)"
          if [ "$COUNT" -ne "$REGISTERED" ]; then
            echo "ERROR: 발견 ${COUNT}대 vs TG 등록 ${REGISTERED}대 — 미배포 인스턴스가 구버전으로 서비스 중일 수 있음" >&2
            exit 1
          fi

          echo "==> 정합성 검증 2: 워커 타이머 active가 정확히 1대"
          # 마커 유실(일기/푸시 무음 정지)과 이중 실행(LLM 비용 2배) 둘 다 여기서 빨간 빌드가 된다.
          # poll_ssm 재사용: 고정 sleep은 느린 응답에서 "확인 불가"를 "비활성"으로 오독한다 —
          # 2대 active(진짜 사고)를 1대로 세어 초록불이 되는 false-green이 최악이므로,
          # 상태 확인이 안 되면 세지 않고 즉시 실패한다.
          ACTIVE=0
          for ID in $INSTANCE_IDS; do
            CMD_ID="$(aws ssm send-command --region "$AWS_REGION" \
              --instance-ids "$ID" --document-name "AWS-RunShellScript" \
              --parameters 'commands=["systemctl is-active moly-worker.timer || true"]' \
              --query "Command.CommandId" --output text)"
            if ! poll_ssm "$CMD_ID" "$ID"; then
              echo "ERROR: [$ID] 워커 타이머 상태 확인 불가 — 정상으로 위장하지 않고 실패 처리" >&2
              exit 1
            fi
            OUT="$(aws ssm get-command-invocation --region "$AWS_REGION" \
              --command-id "$CMD_ID" --instance-id "$ID" \
              --query "StandardOutputContent" --output text | tr -d '[:space:]')"
            echo "  $ID moly-worker.timer=$OUT"
            if [ "$OUT" = "active" ]; then
              ACTIVE=$((ACTIVE + 1))
            fi
          done
          if [ "$ACTIVE" -ne 1 ]; then
            echo "ERROR: 워커 타이머 active ${ACTIVE}대 (기대 1대) — 0대면 일기/푸시 무음 정지, 2대면 매시 틱 2회(LLM 비용 2배)" >&2
            echo "확인: /etc/moly-worker-host 마커 (워커 호스트 1대에만 존재해야 함)" >&2
            exit 1
          fi
          echo "==> 배포 성공 (${COUNT}대 롤링 + 정합성 검증 통과)"

      # 7. 배포후 헬스 스모크 — 배포 성공 시에만 실행(앞 스텝 실패면 건너뜀).
      #    version 검증은 연속 10회 전부 새 sha여야 통과 — ALB 뒤에서 한 대만 갱신된 채
      #    초록불이 되는 것 방지. /health/synthetic(의존성 능동점검) → Slack 알림.
      #    보수적: 자동 롤백 안 함. 실패 시 워크플로만 red + Slack으로 사람이 판단.
      #    필요 secret: HEALTH_TOKEN, SLACK_STATUS_WEBHOOK_URL (레포 Settings→Secrets 등록).
      - name: Post-deploy health smoke
        env:
          # 시크릿은 env로 주입(셸 인라인 치환 회피 — 특수문자 인젝션 방지).
          HEALTH_TOKEN: ${{ secrets.HEALTH_TOKEN }}
          SLACK_STATUS_WEBHOOK_URL: ${{ secrets.SLACK_STATUS_WEBHOOK_URL }}
        run: |
          set -uo pipefail
          BASE="https://voice.moly.asia"
          SHA7="${DEPLOY_TAG::7}"

          # /health/ready 200 될 때까지 폴링(최대 10회 × 6s = 배포 재기동 대기)
          ready_ok=0
          for i in $(seq 1 10); do
            code="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "$BASE/health/ready" || echo 000)"
            echo "  [$i] /health/ready → $code"
            if [ "$code" = "200" ]; then ready_ok=1; break; fi
            sleep 6
          done

          # 배포 버전 반영 확인 — 연속 10회 전부 새 sha (ALB 분산 대비)
          ver_ok=1
          last_ver=""
          for i in $(seq 1 10); do
            last_ver="$(curl -s --max-time 10 "$BASE/health" | sed -n 's/.*"version":"\([^"]*\)".*/\1/p' || true)"
            if [ "$last_ver" = "$DEPLOY_TAG" ]; then
              echo "  [$i] version OK"
            else
              echo "  [$i] version 불일치: ${last_ver:-?}"
              ver_ok=0
            fi
            sleep 1
          done

          # 의존성 능동점검(DB·LLM) 1회
          syn="$(curl -s -o /dev/null -w '%{http_code}' --max-time 30 \
            -H "X-Health-Token: ${HEALTH_TOKEN}" "$BASE/health/synthetic" || echo 000)"

          if [ "$ready_ok" = "1" ] && [ "$ver_ok" = "1" ] && [ "$syn" = "200" ]; then
            msg="✅ 배포 ${SHA7} 헬스 정상 (version 10/10 일치, synthetic=200)"
            fail=0
          else
            msg="❌ 배포 ${SHA7} 헬스 실패 (ready_ok=${ready_ok}, ver_ok=${ver_ok}, last_ver=${last_ver:-?}, synthetic=${syn}) — 롤백 검토: 이전 sha로 재배포"
            fail=1
          fi
          echo "$msg"

          # Slack status 채널 알림(미설정 시 스킵)
          hook="${SLACK_STATUS_WEBHOOK_URL}"
          if [ -n "$hook" ]; then
            curl -s -X POST -H 'Content-type: application/json' \
              --data "$(printf '{"text":%s}' "$(printf '%s' "$msg" | python3 -c 'import json,sys; print(json.dumps(sys.stdin.read()))')")" \
              "$hook" || true
          fi

          # 헬스 실패면 워크플로 red(신호용, 자동복구는 안 함)
          [ "$fail" = "0" ]
