          application/json:
            schema: {$ref: ../components/fortune.yaml#/schemas/DailyFortuneRevealResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '403':
        description: 개발 기능이 비활성화됨
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              featureUnavailable:
                summary: 개발 기능 비활성
                value: {error: {code: FEATURE_UNAVAILABLE, message: 오늘의 운세 기능을 사용할 수 없어요., details: {}}}
      '404':
        description: 운세 프로필을 아직 입력하지 않음
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              profileRequired:
                summary: 운세 프로필 미입력
                value: {error: {code: PROFILE_REQUIRED, message: 운세 정보를 먼저 입력해 주세요., details: {}}}
      '409':
        description: 현지 날짜가 바뀌는 중이므로 재시도 필요
