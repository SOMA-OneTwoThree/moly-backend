# PR 검증 — lint + 전체 유닛 테스트(OpenAPI 계약 테스트 포함).
# main ruleset의 required status check("test")로 지정되어 실패하면 머지가 차단된다.
name: CI

on:
  pull_request:

# 같은 PR에 연속 push 시 이전 실행을 취소하고 최신만 검증
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 엔진 생성용 자리표시자 — 유닛 테스트는 실제 DB에 접속하지 않는다
  SUPABASE_DB_CONNECTION_STRING: postgresql+asyncpg://placeholder:placeholder@localhost:5432/placeholder

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: schema-test-only
          POSTGRES_DB: moly_schema_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d moly_schema_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.13"
          enable-cache: true

      - name: Install dependencies
        run: uv sync --frozen

      - name: Validate banner catalog and assets
        env:
          BANNER_ENVIRONMENT: ${{ github.base_ref == 'main' && 'prod' || 'dev' }}
        run: uv run python scripts/validate_banners.py --assets --environment "$BANNER_ENVIRONMENT"

      - name: Lint
        run: uv run ruff check app worker scripts tests db

      - name: Check generated fortune copy documents
        run: uv run python scripts/build_fortune_copy_docs.py --check

      - name: Check fortune copy structure and reviewed content hashes
        run: uv run python scripts/check_fortune_tarot_editorial.py

      - name: Rebuild schema contract and check database behavior
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: postgres
          PGPASSWORD: schema-test-only
          PGDATABASE: moly_schema_ci
          SUPABASE_DB_CONNECTION_STRING: postgresql://postgres:schema-test-only@127.0.0.1:5432/moly_schema_ci
          MOLY_SCHEMA_TEST_DSN: postgresql://postgres:schema-test-only@127.0.0.1:5432/moly_schema_ci
        run: |
          psql -X -v ON_ERROR_STOP=1 -f db/testing/supabase.sql
          uv run python -m db.schema_contract --check-generated
          psql -X -v ON_ERROR_STOP=1 -f db/seed.sql
          uv run pytest -q tests/integration/test_schema_bootstrap_local.py tests/integration/test_memory_maintenance_local.py tests/integration/test_maintenance_enrollment_local.py tests/integration/test_weekly_diary.py tests/integration/test_fortune_variants.py tests/integration/test_fortune_experience.py

      - name: Test (통합 테스트 제외 — 실 Supabase 필요)
        run: uv run pytest -q --ignore=tests/integration
