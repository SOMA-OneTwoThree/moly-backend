schemas:
  MetaAttribution:
    properties:
      ad_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Ad Id
      adgroup_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Adgroup Id
      adgroup_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Adgroup Name
      campaign_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Campaign Id
      campaign_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Campaign Name
      campaign_group_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Campaign Group Id
      campaign_group_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Campaign Group Name
      account_id:
        anyOf:
        - type: string
        - type: 'null'
        title: Account Id
      ad_objective_name:
        anyOf:
        - type: string
        - type: 'null'
        title: Ad Objective Name
    additionalProperties: false
    type: object
    title: MetaAttribution
    description: 복호화된 귀속 값. Meta는 숫자처럼 보이는 ID도 전부 문자열로 준다. 암호문에 없던 필드는 키는 있고 값이 null이다.
  MetaReferrerDecryptRequest:
    properties:
      utm_content:
        type: string
        maxLength: 8192
        title: Utm Content
        description: Google Play 설치 리퍼러의 utm_content 원문. URL 디코드된 JSON과 percent-encoded JSON을 모두 받는다.
    additionalProperties: false
    type: object
    required:
    - utm_content
    title: MetaReferrerDecryptRequest
  MetaReferrerDecryptResponse:
    properties:
      attribution:
        anyOf:
        - $ref: '#/schemas/MetaAttribution'
        - type: 'null'
        description: Meta 암호문이 없으면 null이다. 오류가 아니라 정상적인 '귀속 없음' 결과다.
    additionalProperties: false
    type: object
    required:
    - attribution
    title: MetaReferrerDecryptResponse
responses:
  AttributionDecryptFailed:
    description: 요청 형식 오류이거나, 암호문은 있지만 복호화에 실패함(키 불일치·손상). 재시도해도 결과가 같다.
    content:
      application/json:
        schema:
          $ref: ../components/common.yaml#/schemas/ErrorEnvelope
        examples:
          requestValidation:
            summary: 요청 검증
            value:
              error:
                code: VALIDATION
                message: 요청 형식이 올바르지 않습니다.
                details:
                  errors:
                  - loc:
                    - body
                    - utm_content
                    type: missing
                    msg: Field required
          decryptFailed:
            summary: 복호화 실패
            value:
              error:
                code: ATTRIBUTION_DECRYPT_FAILED
                message: 설치 리퍼러를 복호화할 수 없어요.
                details: {}
  AttributionKeyUnavailable:
    description: 서버에 복호화 키가 설정되지 않음. 설정 반영 후 성공하므로 client는 재시도해도 된다.
    content:
      application/json:
        schema:
          $ref: ../components/common.yaml#/schemas/ErrorEnvelope
        examples:
          keyUnavailable:
            summary: 키 미설정
            value:
              error:
                code: ATTRIBUTION_KEY_UNAVAILABLE
                message: 설치 귀속 복호화를 잠시 사용할 수 없어요.
                details: {}
