      '422': {$ref: ../components/common.yaml#/responses/Validation}
    security: [{SupabaseBearer: []}]

/daily-fortune/ad-sessions:
  post:
    tags: [fortune]
    summary: 운세 공개용 광고 세션 발급
    operationId: createFortuneAdSession
    requestBody:
      required: true
      content:
        application/json:
          schema: {$ref: ../components/fortune.yaml#/schemas/FortuneAdSessionRequest}
    responses:
      '200':
        description: 같은 client_request_id의 기존 세션
        content:
          application/json:
            schema: {$ref: ../components/fortune.yaml#/schemas/FortuneAdSessionResponse}
      '201':
        description: 새 광고 세션
        content:
          application/json:
            schema: {$ref: ../components/fortune.yaml#/schemas/FortuneAdSessionResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '403':
        description: 광고가 필요하지 않거나 개발 기능이 비활성화됨
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              adNotRequired:
                summary: 광고가 필요하지 않음
                value: {error: {code: AD_NOT_REQUIRED, message: 운세 광고가 필요하지 않아요., details: {}}}
              featureUnavailable:
                summary: 개발 기능 비활성
                value: {error: {code: FEATURE_UNAVAILABLE, message: 오늘의 운세 기능을 사용할 수 없어요., details: {}}}
      '404':
        description: 운세 프로필을 아직 입력하지 않음
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              profileRequired:
                summary: 운세 프로필 미입력
                value: {error: {code: PROFILE_REQUIRED, message: 운세 정보를 먼저 입력해 주세요., details: {}}}
      '409':
        description: 현지 날짜가 바뀌는 중이므로 재시도 필요
        content:
          application/json:
            schema: {$ref: ../components/common.yaml#/schemas/ErrorEnvelope}
            examples:
              dateRollover:
                summary: 현지 날짜 전환 보호
                value: {error: {code: DATE_ROLLOVER, message: 날짜가 바뀌고 있어요. 잠시 후 다시 시도해 주세요., details: {}}}
              accountDeleting:
                summary: 계정 삭제 진행 중
                value: {error: {code: ACCOUNT_DELETING, message: 계정 삭제를 처리하고 있어요., details: {}}}
      '422': {$ref: ../components/common.yaml#/responses/Validation}
    security: [{SupabaseBearer: []}]

parameters:
  AppLocale:
    name: X-App-Locale
    in: header
    required: false
    schema:
      anyOf: [{type: string, enum: [ko, en, ja]}, {type: 'null'}]
