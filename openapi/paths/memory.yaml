/memory:
  get:
    tags:
    - memory
    summary: 기억 목록 조회
    operationId: listMemory
    responses:
      '200':
        description: 현재 유효한 정규화 기억
        content:
          application/json:
            schema:
              $ref: ../components/memory.yaml#/schemas/MemoryListResponse
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '500':
        $ref: ../components/common.yaml#/responses/Internal
    security:
    - SupabaseBearer: []
/memory/search:
  post:
    tags:
    - memory
    summary: 기억 의미 검색
    operationId: searchMemory
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/memory.yaml#/schemas/MemorySearchRequest
    responses:
      '200':
        description: 의미 유사도순 기억 검색 결과
        content:
          application/json:
            schema:
              $ref: ../components/memory.yaml#/schemas/MemorySearchResponse
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
      '500':
        $ref: ../components/common.yaml#/responses/Internal
    security:
    - SupabaseBearer: []
/memory/forget:
  post:
    tags:
    - memory
    summary: 기억 삭제
    description: 확인된 요청에 한해 사실, 술어 범위 또는 사용자의 모든 기억을 망각 처리한다.
    operationId: forgetMemory
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/memory.yaml#/schemas/MemoryForgetRequest
    responses:
      '200':
        description: 망각 및 파생 기억 무효화 결과
        content:
          application/json:
            schema:
              $ref: ../components/memory.yaml#/schemas/MemoryForgetResponse
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '422':
        $ref: ../components/common.yaml#/responses/Validation
      '500':
        $ref: ../components/common.yaml#/responses/Internal
    security:
    - SupabaseBearer: []
