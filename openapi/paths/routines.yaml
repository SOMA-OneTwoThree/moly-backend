/routines/history:
  get:
    tags:
    - routine
    summary: 날짜별 루틴 기록 조회
    operationId: getRoutineHistory
    responses:
      '200':
        description: 선택일 루틴 기록
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineHistoryResponse
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        $ref: ../components/common.yaml#/responses/Validation
    security:
    - SupabaseBearer: []
    description: 선택일에 예정이었던 루틴(스킵 포함, 나중에 삭제된 루틴 포함)과 선택일에 완료한 루틴을 반환한다. 예정 여부와
      days_of_week는 선택일에 적용되던 요일 이력으로 정한다. 미래 날짜는 422. 날짜 헤더는 선택 날짜가 아니라 요청 시점의 실제
      오늘이다. 읽기 전용이며 조회 기간에 30일 제한이 없다.
    parameters:
    - name: date
      in: query
      required: true
      schema:
        type: string
        format: date
      description: YYYY-MM-DD 달력 날짜. 실제 오늘 이하.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
/routines/stats:
  get:
    tags:
    - routine
    summary: 루틴 기록 통계
    operationId: getRoutineStats
    security:
    - SupabaseBearer: []
    description: 날짜는 모두 요청의 현지 날짜다. 인스턴스는 그날 완료했거나, 예정이었고 스킵하지 않은 (루틴, 날짜)다. summary는
      삭제된 루틴을 포함한 전 기간 값이고 days는 from..min(to, today)의 날짜별 인스턴스·완료 수다. from ≤ to이고 기간은
      371일 이하여야 하며 to가 today 뒤면 today로 자른다.
    parameters:
    - name: from
      in: query
      required: true
      schema:
        type: string
        format: date
      description: YYYY-MM-DD 시작 날짜(포함).
    - name: to
      in: query
      required: true
      schema:
        type: string
        format: date
      description: YYYY-MM-DD 끝 날짜(포함). from부터 371일 이하.
    - name: X-App-Timezone
      in: header
      required: false
      description: 현재 기기의 IANA 시간대. 생략 시 저장 시간대. 잘못된 값은 APP_TIMEZONE_INVALID.
      schema:
        type: string
        minLength: 1
        maxLength: 64
    responses:
      '200':
        description: 루틴 기록 통계
        content:
          application/json:
            schema:
              $ref: ../components/routines.yaml#/schemas/RoutineStatsResponse
        headers:
          X-App-Local-Date:
            description: 실제 계산에 사용한 현지 날짜
            schema:
              type: string
              format: date
          X-App-Served-At:
            description: 단일 요청 서버 UTC 시각
            schema:
              type: string
              format: date-time
          X-App-Day-Ends-At:
            description: 다음 현지 달력일 자정의 UTC 시각
            schema:
              type: string
              format: date-time
      '500':
        $ref: ../components/common.yaml#/responses/Internal
      '401':
        $ref: ../components/common.yaml#/responses/Unauthorized
      '404':
        $ref: ../components/common.yaml#/responses/ProfileNotFound
      '422':
        $ref: ../components/common.yaml#/responses/Validation
