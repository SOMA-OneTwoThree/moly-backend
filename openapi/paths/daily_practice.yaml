/daily-practice:
  get:
    tags: [daily-practice]
    summary: 오늘의 작은 실천 조회
    operationId: getDailyPractice
    description: 읽기 전용이다. 제안을 만들지 않는다.
    parameters:
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    responses:
      '200': &today
        description: 오늘의 상태
        headers:
          Cache-Control:
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema: {$ref: ../components/daily_practice.yaml#/schemas/DailyPracticeToday}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/ReadNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/AccountDeleting}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
/daily-practice/offer:
  post:
    tags: [daily-practice]
    summary: 오늘의 제안 받기
    operationId: offerDailyPractice
    description: >-
      상태와 무관하게 현재 행을 반환하고, 오늘 제안이 없을 때만 첫 제안을 만든다. 풀이 비어 있으면
      오류 없이 200과 practice null을 반환한다. LLM을 부르지 않는다.
    parameters:
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: ../components/daily_practice.yaml#/schemas/DailyPracticeOfferRequest}
    responses:
      '200': *today
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/ReadNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/AccountDeleting}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
/daily-practice/{id}/skip:
  post:
    tags: [daily-practice]
    summary: 건너뛰고 다음 제안 받기
    operationId: skipDailyPractice
    description: >-
      offered에서만 가능하다. 건너뛴 것을 기록하고 다음 제안을 반환한다. 후보가 없으면 practice는 null이다. offers_remaining이 0이면 409 DAILY_PRACTICE_OFFER_LIMIT.
    parameters:
    - {$ref: ../components/daily_practice.yaml#/parameters/PracticeId}
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    requestBody:
      required: false
      content:
        application/json:
          schema: {$ref: ../components/daily_practice.yaml#/schemas/DailyPracticeOfferRequest}
    responses:
      '200': *today
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/PracticeNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/SkipConflict}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
/daily-practice/{id}/accept:
  post:
    tags: [daily-practice]
    summary: 제안 수락
    operationId: acceptDailyPractice
    description: >-
      offered를 accepted로 바꾼다. 이미 accepted면 그대로 반환한다.
    parameters:
    - {$ref: ../components/daily_practice.yaml#/parameters/PracticeId}
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    responses:
      '200': *today
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/PracticeNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/TransitionConflict}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
/daily-practice/{id}/complete:
  post:
    tags: [daily-practice]
    summary: 실천 완료
    operationId: completeDailyPractice
    description: >-
      accepted를 completed로 바꾼다. 이미 completed면 그대로 반환한다.
    parameters:
    - {$ref: ../components/daily_practice.yaml#/parameters/PracticeId}
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    responses:
      '200': *today
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/PracticeNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/TransitionConflict}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
/daily-practice/{id}/uncomplete:
  post:
    tags: [daily-practice]
    summary: 완료 취소
    operationId: uncompleteDailyPractice
    description: >-
      잘못 누른 완료를 되돌린다. completed를 accepted로 바꾸고 이미 accepted면 그대로 반환한다. routine_added면 409 DAILY_PRACTICE_INVALID_STATE.
    parameters:
    - {$ref: ../components/daily_practice.yaml#/parameters/PracticeId}
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    responses:
      '200': *today
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/PracticeNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/TransitionConflict}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
/daily-practice/{id}/routine:
  post:
    tags: [daily-practice]
    summary: 루틴으로 추가
    operationId: addDailyPracticeRoutine
    description: >-
      completed에서만 가능하다. 한 트랜잭션에서 루틴을 만들고 routine_added를 켠다. 이름은 요청 언어의 title, name_i18n은 세 언어, 아이콘은 행동의 icon, 색은 카테고리별, 요일은 매일, 알림은 없음. 다시 호출하면 같은 루틴을 반환하고 아무것도 만들지 않는다.
    parameters:
    - {$ref: ../components/daily_practice.yaml#/parameters/PracticeId}
    - {$ref: ./affirmation.yaml#/parameters/AppLocale}
    - {$ref: ./affirmation.yaml#/parameters/AppTimezone}
    responses:
      '200':
        description: 오늘의 상태와 만든 루틴
        headers:
          Cache-Control:
            schema:
              type: string
              const: private, no-store
        content:
          application/json:
            schema: {$ref: ../components/daily_practice.yaml#/schemas/DailyPracticeRoutineResponse}
      '401': {$ref: ../components/common.yaml#/responses/Unauthorized}
      '404': {$ref: ../components/daily_practice.yaml#/responses/PracticeNotFound}
      '409': {$ref: ../components/daily_practice.yaml#/responses/TransitionConflict}
      '422': {$ref: ../components/daily_practice.yaml#/responses/Unprocessable}
    security: [{SupabaseBearer: []}]
